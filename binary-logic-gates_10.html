  content: `
<h2>一、從「只有兩種狀態」說起</h2>
<p>你有沒有想過，為什麼我們人類日常生活用的是 0～9 這十個數字，而電腦卻只用 0 和 1？</p>
<p>這不是因為電腦「笨」，而是因為電腦內部的最基本元件——<strong>電晶體（Transistor）</strong>——天生就只有兩種物理狀態：<strong>通電（ON）</strong>或<strong>不通電（OFF）</strong>。就像你家的電燈開關，它只能是「開」或「關」，不可能卡在中間某個模糊位置（如果卡住了，那就是壞掉了）。</p>

<div class="callout analogy">

  <p>想像一排電燈開關掛在牆上。每個開關只能「開」或「關」。你能用這些開關表示不同的資訊嗎？當然可以！用「關-開-關-關」代表某件事，用「開-開-關-開」代表另一件事。電腦就是這樣工作的，只不過電晶體比燈泡開關小了幾十億倍，而且每秒可以切換數十億次。</p>
</div>

<h2>二、十進位 vs 二進位——計數方式的比較</h2>
<p>我們人類使用<strong>十進位（Decimal）</strong>，每個數位有 0～9 共十個選擇，這可能是因為人有十根手指。但電腦的「手指」只有通電和不通電，所以它用的是<strong>二進位（Binary）</strong>，每個數位只有 0 或 1 兩個選擇。</p>
<p>讓我們比較一下：十進位逢十進一，二進位逢二進一。</p>

<h2>三、位元、位元組——電腦資料的單位</h2>
<p>理解了 0 和 1 之後，我們來認識電腦資料的基本單位。</p>

<h2>四、為什麼不用三進位或十進位的電腦？</h2>
<p>歷史上確實有人嘗試過三進位電腦（蘇聯在 1950 年代製造了 Setun 電腦）。理論上，三進位系統在某些計算上效率更高。但為什麼二進位最終勝出？</p>
<p>關鍵是<strong>可靠性</strong>。電子訊號在傳輸過程中會有雜訊（噪音）。如果只需要區分「高電壓」和「低電壓」兩個狀態，就算訊號有些許波動，電路仍然能正確判斷它是 0 還是 1。但如果要區分三個或更多電壓等級，對硬體的精度要求就會大幅提升，電路也會更容易出錯。</p>

<div class="callout tip">

  <p>二進位勝出的三大理由：① <strong>物理上最穩定</strong>——只需區分兩個電壓狀態，容錯空間最大；② <strong>硬體最簡單</strong>——邏輯電路設計大幅簡化；③ <strong>布林代數完美對應</strong>——數學工具齊全，設計有理論支撐。</p>
</div>

<h2>六、二進位轉十進位的計算方法</h2>
<p>每個二進位數位的「權重」是 2 的次方，從右邊（最低位）開始，依序是 2⁰、2¹、2²、2³……</p>
<div class="code-block"><code><span class="c">// 計算二進位 1011 的十進位值</span>

位數：  3  2  1  0       ← 從右側第 0 位開始
數字：  1  0  1  1
       ↓  ↓  ↓  ↓
權重：  8  4  2  1       ← 2³ 2² 2¹ 2⁰

計算：  1×8 + 0×4 + 1×2 + 1×1
     = 8 + 0 + 2 + 1
     = <span class="v">11</span>              ← 答案是十進位的 11</code></div>

<div class="callout def">
  <span class="callout-icon"></span>
  <p><strong>位值制（Positional Notation）：</strong>每個數字位置都有一個「權重」，該位的值等於「數字 × 權重」之總和。十進位的權重是 10 的次方，二進位的權重是 2 的次方。這個原則適用於所有進位系統。</p>
</div>

<h2>七、十進位轉二進位——除 2 取餘法</h2>
<p>想把十進位數字轉成二進位，可以用「不斷除以 2，記錄餘數」的方法，最後把餘數從下往上排列。</p>
<div class="code-block"><code><span class="c">// 把十進位 13 轉成二進位</span>

13 ÷ 2 = 6 餘 <span class="v">1</span>  ← 最低位 (bit 0)
 6 ÷ 2 = 3 餘 <span class="v">0</span>
 3 ÷ 2 = 1 餘 <span class="v">1</span>
 1 ÷ 2 = 0 餘 <span class="v">1</span>  ← 最高位 (bit 3)

從下往上讀餘數：<span class="v">1101</span>

驗算：8 + 4 + 0 + 1 = 13 ✓</code></div>

<div class="callout warning">

</div>

<h2>四、電路圖 → 布林式（反向讀取）</h2>

<p>先回顧二進位的加法規則：</p>
<div class="code-block"><code><span class="c">// 兩個 1 位元二進位數相加的所有情況</span>

0 + 1 = <span class="bit-1">1</span>    → 和 = 1，進位 = 0
1 + 0 = <span class="bit-1">1</span>    → 和 = 1，進位 = 0

<h2>五、為什麼叫「半」加器？</h2>
<p>半加器被稱為「半」，是因為它<strong>不能處理來自上一位的進位輸入（Carry-in）</strong>。在多位元加法中，每一個位元位置（除了最低位）都可能收到來自低位的進位：</p>
<div class="code-block"><code><span class="c">// 多位元二進位加法示例</span>

      <span class="bit-1">1</span> <span class="bit-1">1</span>     ← 進位
  0 <span class="bit-1">1</span> <span class="bit-1">1</span> <span class="bit-1">1</span>    (十進位 7)
+ 0 <span class="bit-1">1</span> <span class="bit-0">0</span> <span class="bit-1">1</span>    (十進位 5)
─────────
  <span class="bit-1">1</span> <span class="bit-1">1</span> <span class="bit-0">0</span> <span class="bit-0">0</span>    (十進位 12)

中間位（bit 1）= A 的該位 + B 的該位 + 來自 bit 0 的進位
→ 三個輸入的加法！半加器只能處理兩個輸入，不夠用！</code></div>
<p>解決方案就是下一回要學的<strong>全加器（Full Adder）</strong>——它有三個輸入（A、B 加上進位輸入 Cin），能正確處理所有位元的加法。</p>

<h2>四、超前進位加法器（Carry Look-Ahead Adder）</h2>
<p>超前進位加法器（CLA）的核心思想：<strong>不等低位算完，直接用原始輸入 A 和 B 「預測」每一位的進位</strong>。它引入兩個輔助概念：</p>
<div class="code-block"><code><span class="c">// 進位產生（Generate）與進位傳播（Propagate）</span>

  Gᵢ = Aᵢ · Bᵢ
  意思：若 A 和 B 都是 1，不管 Cin 如何，一定產生進位

Propagate（Pᵢ）：「若收到進位，這一位會把它傳遞出去」
  Pᵢ = Aᵢ + Bᵢ   (有些版本用 Aᵢ ⊕ Bᵢ)

<span class="c">// 用 G 和 P 直接計算每一位的進位（不需等待！）</span>
C₀ = Cin  （初始進位）
C₁ = G₀ + P₀·C₀
C₂ = G₁ + P₁·C₁ = G₁ + P₁·G₀ + P₁·P₀·C₀
C₃ = G₂ + P₂·G₁ + P₂·P₁·G₀ + P₂·P₁·P₀·C₀
<span class="c">// 所有進位都可以同時計算，只需 2 層閘的延遲！</span></code></div>

<h2>三、如何計算二補數（求負數的表示）</h2>
<div class="code-block"><code><span class="c">// 方法一：取一補數（逐位取反）再加 1</span>

以 4 位元為例，求 -5 的二補數：
步驟 1：+5 的二進位表示  = <span class="bit-1">0</span><span class="bit-1">1</span><span class="bit-0">0</span><span class="bit-1">1</span>
步驟 2：逐位取反（一補數） = <span class="bit-1">1</span><span class="bit-0">0</span><span class="bit-1">1</span><span class="bit-0">0</span>
步驟 3：加 1               = <span class="bit-1">1</span><span class="bit-0">0</span><span class="bit-1">11</span>  ← 這就是 -5 的二補數

<span class="c">// 方法二：快速法——從右往左，遇到第一個 1 之前保持不變，之後逐位取反</span>

+5  = 0 1 0 1
        ↓ ↓ ↓ ↓
-5  = 1 0 1 1   ← 最右邊的 1 保留，左側全部取反</code></div>

<div class="callout tip">

<h2>五、減法 = 加上二補數</h2>
<div class="code-block"><code><span class="c">// A - B = A + (-B) = A + (~B + 1)</span>

 -B = -7 = 1001

    0011   (+3)
  + 1001   (-7)
  ──────

<p>4 個資料輸入（D₀～D₃），需要 2 個選擇訊號（S₁、S₀，可以編碼 4 種選擇）：</p>
<div class="code-block"><code><span class="c">// 4:1 MUX 選擇邏輯</span>

S₁=0, S₀=0 → Y = D₀
S₁=0, S₀=1 → Y = D₁
S₁=1, S₀=0 → Y = D₂
S₁=1, S₀=1 → Y = D₃

布林式：
Y = S₁'·S₀'·D₀ + S₁'·S₀·D₁ + S₁·S₀'·D₂ + S₁·S₀·D₃

<span class="c">// 2 個 S → 4:1 MUX（4 個輸入）</span>
<span class="c">// 3 個 S → 8:1 MUX（8 個輸入）</span>
</code></div>

<h2>五、解多工器（DEMUX）——MUX 的反向操作</h2>
<p><strong>解多工器（Demultiplexer，DEMUX）</strong>是 MUX 的反向操作：<strong>一個輸入，根據選擇訊號，把資料送到多個輸出之一</strong>（其他輸出為 0）。</p>

<p><strong>編碼器（Encoder）</strong>是解碼器的反向操作：輸入 2ⁿ 條線（每次只有一條為高電位），輸出 n 位元的二進位碼，表示哪條輸入線被啟動。</p>

D₀=1, D₁=0, D₂=0, D₃=0  → A=0, B=0   (00)
D₀=0, D₁=1, D₂=0, D₃=0  → A=0, B=1   (01)
D₀=0, D₁=0, D₂=1, D₃=0  → A=1, B=0   (10)
D₀=0, D₁=0, D₂=0, D₃=1  → A=1, B=1   (11)

布林式：

  B = D₁ + D₃   (輸入 1 或 3 時，B 為 1)

只需要 2 個 OR 閘！</code></div>

<h2>六、優先權編碼器（Priority Encoder）</h2>
<p>普通編碼器的問題：若同時有多條輸入為高電位，輸出會出錯。<strong>優先權編碼器（Priority Encoder）</strong>解決這個問題：若多條輸入同時有效，輸出的是「優先順序最高」的那條（通常是編號最大的）。</p>

D₃=0, D₂=0, D₁=0, D₀=1 → 輸出 00

<p><strong>SR Latch</strong>（Set-Reset Latch）由<strong>兩個 NOR 閘交叉回授</strong>構成——每個 NOR 閘的輸出回饋到另一個 NOR 閘的輸入。這個回授迴路讓電路能「自我維持」狀態。</p>

  Q' = (R + Q)'   = NOR(R, Q)

  等一下，重新追蹤：

  矛盾了，重新：S=1, Q'=1 → Q=0，R=0, Q=0 → Q'=1 穩定

  <span class="c">// 等等，這和「Set 讓 Q=1」矛盾？</span>

<h2>一、暫存器是什麼？</h2>
<p><strong>暫存器（Register）</strong>是由多個 D Flip-Flop 組成的儲存電路，可以同時儲存多個位元的資料。一個 n 位元暫存器就是 n 個 D Flip-Flop 並排，共用同一個時脈訊號（CLK）。</p>
<p>暫存器是 CPU 內部最快的儲存元件——比 SRAM 快、比 DRAM 更快，因為它就在 CPU 核心裡面，不需要透過匯流排存取。現代 CPU 通常有 16 到 32 個通用暫存器（x86-64 有 16 個 64 位元通用暫存器）。</p>

<div class="callout analogy">
  <span class="callout-icon"></span>
  <p>把 CPU 想成一個廚師，記憶體是廚房倉庫，暫存器就是廚師手邊的砧板和幾個小碗。廚師做菜時，食材（資料）從倉庫取出放到砧板上（載入暫存器），所有的切、拌、炒（ALU 運算）都在砧板上進行，完成後才放回倉庫（寫回記憶體）。砧板容量小，但存取極快——這正是暫存器的角色。</p>
</div>

<h2>二、4 位元並列載入暫存器</h2>

<h2>三、帶致能（Enable）的暫存器</h2>
<p>實際的暫存器通常加上 <strong>Load（載入）</strong>控制訊號：Load=1 時才接受新資料，Load=0 時保持當前值不變。</p>
<div class="code-block"><code><span class="c">// 帶 Load 控制的暫存器 D 輸入邏輯</span>

D_ff = Load · D_in + Load' · Q_out

<span class="c">// 等同於一個 2:1 MUX：</span>
<span class="c">// Load=1 → 選 D_in（載入新值）</span>
<span class="c">// Load=0 → 選 Q_out（回授自身，保持舊值）</span>

用 MUX 實作：
  MUX 輸入 D₀ = Q（自身回授）
  MUX 輸入 D₁ = D_in（新資料）
  MUX 選擇   = Load
  MUX 輸出  → D Flip-Flop 的 D 端</code></div>

<h2>四、移位暫存器（Shift Register）</h2>
<p>把多個 D Flip-Flop <strong>串接</strong>（前一個的 Q 連到後一個的 D），每個時脈邊緣資料向右（或向左）移動一位，就是<strong>移位暫存器（Shift Register）</strong>。</p>

<h2>五、移位暫存器的應用</h2>
<div class="code-block"><code><span class="c">// 移位暫存器的三大用途</span>

<span class="c">1. 序列轉並列（SIPO）：</span>
   一次輸入一個位元，4 個時脈後輸出 4 位元並列資料
   應用：UART 序列通訊接收端，把序列位元流轉成並列位元組

<span class="c">2. 乘以 / 除以 2 的次方（算術移位）：</span>
   左移 1 位 = × 2   （1010 → 10100，即 10 → 20）
   右移 1 位 = ÷ 2   （1010 → 0101，即 10 → 5）
   CPU 的移位指令（SHL, SHR, SAL, SAR）就是移位暫存器

<span class="c">3. 環形計數器（Ring Counter）：</span>
   最後一個 FF 的輸出回授到第一個 FF 的輸入
   初始載入 1000，每個時脈：1000→0100→0010→0001→1000→...
   每個輸出端輪流被點亮，用於定序控制（如 LED 跑馬燈）</code></div>

<h2>三、計數時序追蹤</h2>
<div class="code-block"><code><span class="c">// 4 位元二進位計數器的狀態序列</span>

CLK 脈衝  Q₃  Q₂  Q₁  Q₀  十進位
   0      0   0   0   0     0   ← 初始
   1      0   0   0   1     1
   2      0   0   1   0     2
   3      0   0   1   1     3
   4      0   1   0   0     4
   5      0   1   0   1     5
   6      0   1   1   0     6
   7      0   1   1   1     7
   8      1   0   0   0     8
   9      1   0   0   1     9
  10      1   0   1   0    10
  11      1   0   1   1    11
  12      1   1   0   0    12
  13      1   1   0   1    13
  14      1   1   1   0    14
  15      1   1   1   1    15
  16      0   0   0   0     0   ← 溢位歸零，重新開始</code></div>

<h2>四、非同步 vs 同步計數器</h2>
<div class="tb-wrap">
<table>
  <thead><tr><th>特性</th><th>非同步計數器（Ripple）</th><th>同步計數器</th></tr></thead>
  <tbody>
    <tr><td>CLK 連接方式</td><td>前一個 FF 的 Q 驅動下一個 CLK</td><td>所有 FF 共用同一個 CLK</td></tr>
    <tr><td>狀態更新時機</td><td>各位元依序更新（有延遲差）</td><td>所有位元同時更新</td></tr>
    <tr><td>延遲</td><td>O(n)，隨位元數線性增加</td><td>O(1)，固定一個 FF 延遲</td></tr>
    <tr><td>毛刺（Glitch）</td><td>可能出現，輸出有過渡假值</td><td>無，輸出乾淨同步</td></tr>
    <tr><td>電路複雜度</td><td>低，接線簡單</td><td>高，需要額外進位邏輯</td></tr>
    <tr><td>功耗</td><td>較低</td><td>較高（所有 FF 同時切換）</td></tr>
    <tr><td>適用場景</td><td>低速、低功耗場合</td><td>高速 CPU、精確時序場合</td></tr>
  </tbody>
</table>
</div>

<div class="callout warning">
  <span class="callout-icon"></span>
  <p>非同步計數器的「毛刺」問題：因為各位元的更新時間不同（高位等低位翻轉後才更新），在極短的過渡期間，計數值可能出現不存在的中間狀態。例如從 0111（7）到 1000（8）的瞬間，可能短暫出現 0110、0100、0000 等假值。在高速系統中這會造成誤觸發，必須改用同步計數器。</p>
</div>

<h2>五、同步計數器的進位邏輯</h2>
<p>同步計數器的所有 FF 共用一個 CLK，用額外的組合邏輯計算每個 FF 是否需要翻轉：</p>
<div class="code-block"><code><span class="c">// 同步二進位計數器的翻轉條件</span>

FF₀ 的翻轉條件：T₀ = 1（每個時脈都翻轉）
FF₁ 的翻轉條件：T₁ = Q₀（Q₀=1 才翻轉）
FF₂ 的翻轉條件：T₂ = Q₀·Q₁（前兩位都是 1 才翻轉）
FF₃ 的翻轉條件：T₃ = Q₀·Q₁·Q₂（前三位都是 1 才翻轉）

<span class="c">// 規律：越高位的 FF，翻轉條件越嚴格</span>
<span class="c">// 只有當所有低位都是 1 時，才對本位翻轉（進位）</span>

<span class="c">// 用 T Flip-Flop（Toggle FF）實作最直接：</span>
<span class="c">// T=1 時翻轉，T=0 時保持</span>
<span class="c">// T₀=1, T₁=Q₀, T₂=Q₀·Q₁, T₃=Q₀·Q₁·Q₂</span></code></div>

<h2>六、模 N 計數器（Modulo-N Counter）</h2>
<p>普通 n 位元計數器計到 2ⁿ-1 後歸零。若需要計到特定值 N-1 後歸零（稱為「模 N 計數器」），可在計到 N 時用 Reset 訊號強制歸零：</p>
<div class="code-block"><code><span class="c">// 模 10 計數器（十進位計數器，BCD 計數器）</span>

正常計數：0, 1, 2, ..., 9, 然後歸零（不計到 15！）

實作：4 位元計數器 + 偵測「計到 10（1010）」的邏輯
當 Q₃=1 且 Q₁=1（即 1010 = 10）時，觸發 Reset

偵測邏輯：Reset = Q₃ · Q₁
<span class="c">// 計到 10 時 Q₃Q₂Q₁Q₀ = 1010，Q₃=1 且 Q₁=1</span>
<span class="c">// Reset 訊號把所有 FF 清零，立即跳回 0000</span>

應用：數位時鐘（秒計數 0-59，分計數 0-59，時計數 0-23）</code></div>

<h2>一、記憶體的基本分類</h2>
<p>學完正反器和暫存器，我們已經理解了「如何儲存 1 個位元」。但 CPU 需要的不只是幾個位元，而是數 GB 甚至數十 GB 的儲存空間。這就引出了兩種主流的半導體記憶體技術：<strong>SRAM</strong> 和 <strong>DRAM</strong>。</p>

<div class="callout analogy">

<h2>二、SRAM（Static RAM）——六電晶體單元</h2>
<p><strong>SRAM（Static Random Access Memory，靜態隨機存取記憶體）</strong>用 6 個電晶體儲存 1 個位元。這 6 個電晶體構成兩個交叉耦合的反相器（本質上是一個 SR Latch）加上存取控制電晶體。</p>

<h2>三、DRAM（Dynamic RAM）——一電晶體一電容</h2>
<p><strong>DRAM（Dynamic RAM，動態隨機存取記憶體）</strong>用「<strong>1 個電晶體 + 1 個電容</strong>」儲存 1 個位元。電容充電代表 1，放電代表 0。</p>

<h2>五、DRAM 的存取方式——列選 × 行選</h2>
<p>DRAM 把位元組織成一個二維矩陣（列 × 行）。存取一個位元需要先送「列位址（RAS）」再送「行位址（CAS）」，這也是為什麼 DRAM 有時稱為 DRAM 延遲（CL 值，如 CL16 表示 16 個時脈週期的 CAS 延遲）。</p>

<div class="code-block"><code><span class="c">// DRAM 存取流程（簡化）</span>

1. 送出列位址（RAS，Row Address Strobe）
   → 選中某一列，整列的電容電荷送上位元線
2. 感測放大器（Sense Amplifier）讀取並放大訊號
   → 這個步驟破壞了電容的電荷（讀取即破壞！）
3. 送出行位址（CAS，Column Address Strobe）
   → 從已讀取的整列中，選出特定行的位元輸出
4. 寫回（Write-back）
   → 感測放大器把剛才讀到的整列資料寫回電容（修復破壞）

<span class="c">// 整個過程比 SRAM 複雜得多，延遲也更長</span>
<span class="c">// 現代 DDR5 DRAM 透過各種技術加速，但本質仍是這個流程</span></code></div>

<h2>六、記憶體階層的設計哲學</h2>
<div class="callout tip">
  <span class="callout-icon"></span>
  <p><strong>局部性原理（Locality Principle）</strong>是記憶體階層設計的基礎：<br>
  • <strong>時間局部性</strong>：剛存取過的資料，近期可能再次存取（把它放進快取！）<br>
  • <strong>空間局部性</strong>：存取某個位址後，附近位址也可能被存取（一次載入整個快取行！）<br><br>
  基於這個原理，只要把「最近最常用的資料」放在速度最快的 SRAM Cache 裡，大部分存取都能命中快取，極少數才需要去慢速的 DRAM 主記憶體——這讓整體存取效能接近 SRAM 的速度，但成本和容量接近 DRAM。</p>
</div>

<h2>五、SSD 的工作原理</h2>
<p>SSD（Solid State Drive）的核心就是大量 NAND Flash 晶片，加上一個負責管理的<strong>Flash 控制器（Controller）</strong>。</p>
<div class="code-block"><code><span class="c">// SSD 關鍵概念</span>

<span class="c">// 1. 儲存密度的演進</span>
SLC（Single Level Cell）：每個浮閘存 1 bit（0 或 1）
  耐寫次數高（~10 萬次），速度快，成本高
MLC（Multi Level Cell）：每個浮閘存 2 bit（4 個電荷等級）

  耐寫次數低（~1000 次），密度高，成本低（消費級 SSD 主流）
QLC（Quad Level Cell）：每個浮閘存 4 bit
  耐寫次數最低（~100 次），適合讀多寫少場合

<h2>一、時脈是什麼？</h2>
<p><strong>時脈訊號（Clock Signal）</strong>是一個週期性的方波——像心跳一樣，以固定頻率在 0 和 1 之間切換。現代 CPU 的時脈頻率通常在 3～5 GHz，即每秒 30～50 億次切換。</p>
<p>時脈的作用是讓整個 CPU 的所有正反器在同一個瞬間更新狀態，確保資料在各電路之間傳遞時不會出現混亂。沒有時脈的協調，數十億個電晶體各自按照自己的速度工作，會造成無法預測的競速條件（Race Condition）。</p>

<div class="code-block"><code><span class="c">// 時脈的關鍵參數</span>

頻率（Frequency）：f = 1 / T
  3 GHz → T = 1 / 3,000,000,000 ≈ 0.33 奈秒（ns）

週期（Period）：T = 1 / f
  每個時脈週期 = CPU 執行一個「最小時間單位」的動作

上升沿（Rising Edge）：時脈從 0 → 1 的瞬間
  邊緣觸發正反器在此刻更新狀態

占空比（Duty Cycle）：高電位時間 / 週期
  理想時脈：50%（高低各半）

<span class="c">// 超頻（Overclocking）的原理與風險</span>
提高 f → T 縮短 → 各電路需要在更短時間內完成計算
優點：計算更快
風險：組合邏輯的傳播延遲可能超過 T，導致錯誤結果
     熱量增加（功耗 ∝ f × C × V²）</code></div>

<h2>三、同步電路的時序約束</h2>
<p>同步電路中，所有資料必須在規定的時間窗口內穩定。對於兩個串接的正反器之間的組合邏輯，必須滿足：</p>
<div class="code-block"><code><span class="c">// 時序約束（Setup/Hold Time）</span>

FF₁ → [組合邏輯，延遲 t_comb] → FF₂

時鐘週期 T 必須滿足：
  T ≥ t_pd(FF₁) + t_comb + t_su(FF₂)

其中：
  t_pd(FF₁)  = FF₁ 的傳播延遲（輸出穩定的時間）
  t_comb     = 組合邏輯的最長路徑延遲（關鍵路徑！）
  t_su(FF₂)  = FF₂ 的 Setup Time（需提前穩定的時間）

<span class="c">// 例：若 t_pd=0.2ns, t_comb=0.5ns, t_su=0.1ns</span>
<span class="c">// 則 T ≥ 0.8ns → 最高頻率 f_max = 1/0.8ns = 1.25 GHz</span>
<span class="c">// 關鍵路徑的延遲決定了 CPU 的最高工作頻率！</span></code></div>

<h2>四、時序違規（Timing Violation）</h2>
<div class="callout warning">
  <span class="callout-icon"></span>
  <p>若時脈週期 T 太短，組合邏輯在下一個時脈邊緣到來前還沒算完，接收端正反器（FF₂）會捕捉到一個不穩定的中間值，這叫做<strong>時序違規（Timing Violation）</strong>。結果是：輸出值不確定（可能是 0 也可能是 1），甚至讓正反器進入<strong>亞穩態（Metastability）</strong>——輸出長時間在 0.5V 附近徘徊，無法確定是 0 或 1，可能讓整個系統崩潰。這就是超頻過度時電腦當機的硬體原因。</p>
</div>

<h2>五、時脈分配網路（Clock Distribution Network）</h2>
<p>現代 CPU 有數十億個正反器，全部需要接收同一個時脈訊號，且時脈到達每個正反器的時間差（<strong>時脈偏斜，Clock Skew</strong>）必須盡可能小（理想為 0）。</p>
<div class="term-grid">
  <div class="term-card">
    <div class="term-en">Clock Skew</div>
    <div class="term-zh">時脈偏斜</div>
    <div class="term-desc">同一個時脈邊緣到達晶片不同位置的時間差。過大的 Skew 可能讓某些 FF 比其他 FF 早一個週期更新，導致資料錯誤。現代晶片的 Skew 控制在幾十 ps 以內。</div>
  </div>
  <div class="term-card">
    <div class="term-en">H-Tree 分配</div>
    <div class="term-zh">H 型樹狀網路</div>
    <div class="term-desc">時脈訊號從中心出發，透過對稱的 H 型樹狀金屬線分配到晶片各角落，確保每條路徑的長度（延遲）完全相同，最小化 Skew。</div>
  </div>
  <div class="term-card">
    <div class="term-en">PLL（鎖相迴路）</div>
    <div class="term-zh">Phase-Locked Loop</div>
    <div class="term-desc">CPU 內部用 PLL 把外部低頻時脈（如 100 MHz 基礎時脈）倍頻到高頻（如 3.6 GHz）。PLL 同時還能微調相位，補償時脈分配路徑的延遲。</div>
  </div>
  <div class="term-card">
    <div class="term-en">時脈閘控（Clock Gating）</div>
    <div class="term-zh">動態省電技術</div>
    <div class="term-desc">當某個電路模組不需要工作時，切斷該區域的時脈供應，避免不必要的電晶體切換（動態功耗 ∝ 切換頻率）。現代 CPU 超過 60% 的電路在任意時刻都被閘控關閉以省電。</div>
  </div>
</div>

<h2>六、時脈頻率的極限在哪裡？</h2>
<div class="code-block"><code><span class="c">// 影響最高時脈頻率的三大因素</span>

① 製程節點（Process Node）：
   電晶體越小（7nm, 5nm, 3nm）→ 切換速度越快
   → 可以在更短時間內完成邏輯計算

② 電壓（Voltage）：
   更高電壓 → 電晶體切換更快，但功耗增加（∝ V²）
   → 現代 CPU 在性能和節能模式間動態調整電壓和頻率（DVFS）

③ 溫度（Temperature）：
   溫度越高 → 電晶體遷移率下降 → 切換變慢
   → 散熱系統決定了 CPU 能維持多高頻率多長時間

<span class="c">// 過去：製程縮小 → 頻率線性提升（Dennard Scaling）</span>
<span class="c">// 2005 年後：功耗牆（Power Wall）使頻率停滯在 ~5 GHz</span>
<span class="c">// 現在的突破點：管線化、多核心、專用加速器</span></code></div>

</div>

<h2>四、管線的三種冒險（Hazard）</h2>
<p>管線不是萬能的，有三類問題會打斷流水線節奏，稱為<strong>冒險（Hazard）</strong>：</p>

<div class="callout def">
  <span class="callout-icon"></span>
  <p><strong>① 結構冒險（Structural Hazard）：</strong>兩條指令同時需要同一個硬體資源。<br>
  例：第 1 條指令在 MEM 階段存取記憶體，第 4 條指令在 IF 階段也需要存取記憶體（若指令和資料共用同一個快取）。<br>
  解法：分開指令快取（I-Cache）和資料快取（D-Cache）——哈佛架構。</p>
</div>

<div class="callout def">
  <span class="callout-icon"></span>
  <p><strong>② 資料冒險（Data Hazard）：</strong>後一條指令依賴前一條還沒寫回的結果。<br>
  例：ADD R1, R2, R3 後緊接著 SUB R4, R1, R5——R1 的新值還在管線中！<br>
  解法：<strong>前遞（Forwarding/Bypassing）</strong>——把 EX 階段的輸出直接繞回給下一條指令的 EX 輸入，不等 WB；或插入「氣泡（Bubble/Stall）」等待。</p>
</div>

<div class="callout def">
  <span class="callout-icon"></span>
  <p><strong>③ 控制冒險（Control Hazard）：</strong>遇到跳轉指令，不知道下一條指令是哪條。<br>
  例：BEQ R1, R2, target——在 EX 階段才知道是否跳轉，此時 IF 和 ID 已取了可能錯誤的指令。<br>
  解法：<strong>分支預測（Branch Prediction）</strong>——猜測跳轉結果，若猜錯則清空管線（沖刷，Flush），代價約 15～20 個時脈。</p>
</div>

<p>CPU 的計算速度在過去幾十年提升了數千倍，但 DRAM 的存取速度只提升了幾倍。這個「記憶體牆（Memory Wall）」讓 CPU 大部分時間都在等待記憶體——快取（Cache）就是為了跨越這道牆而生的。</p>
<p>快取的核心思想來自<strong>局部性原理（Locality Principle）</strong>：程式存取的資料在時間和空間上都有高度集中性。把「最近最常用」的資料放在靠近 CPU 的小型 SRAM 裡，大部分存取請求就能被快速滿足，不需每次都去慢速的 DRAM 取資料。</p>

步驟 3：L2 Miss → 查詢 L3 Cache
  命中 → 回傳並填入 L1/L2，延遲 30～40 個時脈

<h2>三、快取行（Cache Line）</h2>
<p>CPU 不是一次只把 1 個位元組載入快取，而是一次載入一整個<strong>快取行（Cache Line）</strong>——通常是 <strong>64 位元組（512 位元）</strong>。這利用了空間局部性：存取位址 X 後，X 附近的資料也很可能被存取，乾脆一起載入。</p>

  位址 1008: 陣列元素 a[2] = 7

<h2>五、替換策略（Replacement Policy）</h2>
<p>快取滿了要載入新資料時，必須決定踢掉哪一個舊資料：</p>
<div class="code-block"><code><span class="c">// 主要替換策略</span>

LRU（Least Recently Used，最近最少使用）：
  踢掉最久沒被存取的那條快取行
  最接近最優策略，硬體實作需要追蹤使用順序（稍複雜）
  L3 Cache 常用

RRIP / Pseudo-LRU：
  LRU 的近似版本，用少量位元近似追蹤，節省面積
  L1/L2 Cache 常用（追求速度）

Random（隨機替換）：
  隨機選一條踢掉，最簡單
  在高關聯度下效果接近 LRU，有些 CPU 採用</code></div>

<h2>六、寫入策略（Write Policy）</h2>
<div class="term-grid">
  <div class="term-card">
    <div class="term-en">Write-Through（穿透寫）</div>
    <div class="term-zh">同時寫 Cache 和記憶體</div>

  </div>
  <div class="term-card">
    <div class="term-en">Write-Back（回寫）</div>

    <div class="term-desc">寫入只更新 Cache（標記為「髒（Dirty）」），被踢出時才把修改後的資料寫回 DRAM。速度快、頻寬省，但需要 Dirty Bit 管理。現代 CPU 主流。</div>
  </div>
  <div class="term-card">

<p>答案的起點令人意外——<strong>沙子</strong>。沙子的主要成分是二氧化矽（SiO₂），經過提煉可得到高純度的矽（Silicon），這正是幾乎所有晶片的基礎材料。</p>

<p>純矽本身是不良導體。透過<strong>摻雜（Doping）</strong>——注入微量的其他元素——可以精確控制矽的導電特性，這正是製造 P 型和 N 型半導體、進而構成 CMOS 電晶體的基礎。</p>

<span class="c">// CMOS 需要同時製造 NMOS（用 P 型基板）和 PMOS（用 N 型井）</span></code></div>

<p>關鍵差異：<strong>所有量子閘都必須是「可逆」的</strong>（酉變換，Unitary），這和傳統邏輯閘（如 AND、OR 會丟失資訊，不可逆）根本不同——這也是為什麼量子電路的設計思維和傳統電路截然不同。</p>

<h2>六、量子電腦的現實挑戰</h2>
<div class="term-grid">

  `,

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let currentLesson = 1;
const visited = new Set();

// ══════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════
function renderNavBar() {
  const scroll = document.getElementById('navScroll');
  scroll.innerHTML = '';
  LESSONS.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (l.id === currentLesson ? ' active' : '');
    btn.textContent = `第${l.id}回`;
    btn.onclick = () => goToLesson(l.id);
    scroll.appendChild(btn);
  });
  document.getElementById('navProgress').textContent = `${visited.size} / 30`;
}

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';

  const groups = [
    { label: '基礎篇　數字系統', range: [1, 9] },
    { label: '核心篇　邏輯閘', range: [10, 19] },
    { label: '進階篇　電路設計', range: [20, 26] },
    { label: '前沿篇　現代硬體', range: [27, 30] }
  ];

  groups.forEach(g => {
    const sec = document.createElement('div');
    sec.className = 'sidebar-section';
    const head = document.createElement('div');
    head.className = 'sidebar-head';
    head.textContent = g.label;
    sec.appendChild(head);

    LESSONS.filter(l => l.id >= g.range[0] && l.id <= g.range[1]).forEach(l => {
      const item = document.createElement('div');
      item.className = 'sidebar-item' + (l.id === currentLesson ? ' active' : '');
      const hasContent = l.content !== null;
      item.innerHTML = `<span class="num">${String(l.id).padStart(2,'0')}</span><span>${l.title}</span>${!hasContent ? '<span class="lock">🔒</span>' : ''}`;
      item.onclick = () => goToLesson(l.id);
      sec.appendChild(item);
    });
    list.appendChild(sec);
  });

  const pct = Math.round(visited.size / 30 * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';
}

function renderLessons() {
  const container = document.getElementById('lessonsContainer');
  container.innerHTML = '';

  LESSONS.forEach(l => {
    const div = document.createElement('div');
    div.id = `lesson-${l.id}`;
    div.className = 'lesson' + (l.id === currentLesson ? ' active' : '');

    if (l.content === null) {
      // Coming soon
      div.innerHTML = `
        <div class="coming-soon">
          <div class="cs-num">${String(l.id).padStart(2,'0')}</div>
          <h3>${l.title}</h3>
          <p>本回內容尚未發布。請在聊天中輸入「請生成第 ${l.id} 回」來獲取完整內容。</p>
        </div>
      `;
    } else {
      // Full lesson
      div.innerHTML = `
        <div class="lesson-header">
          <div class="lesson-num-badge">
            <span class="label">LESSON</span>
            <span class="n">${String(l.id).padStart(2,'0')}</span>
          </div>
          <div class="lesson-meta">
            <h1>${l.title}</h1>
            <div class="tagline">${l.tagline}</div>
            <div class="tags">${l.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          </div>
        </div>
        ${l.content}
        ${renderQuizSection(l)}
        ${renderLessonNav(l.id)}
      `;
    }
    container.appendChild(div);
  });
}

function renderQuizSection(l) {
  if (!l.quizzes || !l.quizzes.length) return '';
  return `
    <div class="quiz-section">
      <h2>✏ 隨堂測驗（第 ${l.id} 回）</h2>
      ${l.quizzes.map((q, qi) => `
        <div class="quiz-item" id="q-${l.id}-${qi}">
          <div class="quiz-q"><span class="qnum">${qi+1}</span>${q.q}</div>
          <div class="quiz-options">
            ${q.opts.map((opt, oi) => `
              <div class="quiz-opt" onclick="selectOpt(${l.id},${qi},${oi},${q.ans})"
                   id="opt-${l.id}-${qi}-${oi}">
                <span class="opt-key">${String.fromCharCode(65+oi)}.</span>
                <span>${opt.replace(/^[A-D]\. /,'')}</span>
              </div>
            `).join('')}
          </div>
          <button class="show-ans-btn" onclick="showExplain(${l.id},${qi})">▸ 顯示解析</button>
          <div class="quiz-explain" id="explain-${l.id}-${qi}">
            <strong>✓ 解析：</strong> ${q.explain}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderLessonNav(id) {
  return `
    <div class="lesson-nav">
      <button class="lesson-nav-btn" onclick="goToLesson(${id-1})" ${id===1?'disabled':''}>← 上一回</button>
      <span style="font-size:12px;color:var(--ink-muted)">第 ${id} 回 / 共 30 回</span>
      <button class="lesson-nav-btn primary" onclick="goToLesson(${id+1})" ${id===30?'disabled':''}>下一回 →</button>
    </div>
  `;
}

// ══════════════════════════════════════════
//  INTERACTION
// ══════════════════════════════════════════
function goToLesson(id) {
  if (id < 1 || id > 30) return;
  document.getElementById(`lesson-${currentLesson}`)?.classList.remove('active');
  document.querySelectorAll('.nav-btn')[currentLesson-1]?.classList.remove('active');

  currentLesson = id;
  visited.add(id);

  document.getElementById(`lesson-${id}`)?.classList.add('active');
  document.querySelectorAll('.nav-btn')[id-1]?.classList.add('active');

  // Scroll nav button into view
  const btn = document.querySelectorAll('.nav-btn')[id-1];
  btn?.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});

  // update sidebar
  document.querySelectorAll('.sidebar-item').forEach((el, i) => {
    el.classList.toggle('active', i+1 === id);
  });

  const pct = Math.round(visited.size / 30 * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';
  document.getElementById('navProgress').textContent = `${visited.size} / 30`;

  window.scrollTo({top: 0, behavior: 'smooth'});
}

function selectOpt(lessonId, qi, oi, correct) {
  const item = document.getElementById(`q-${lessonId}-${qi}`);
  const opts = item.querySelectorAll('.quiz-opt');
  opts.forEach((el, i) => {
    el.classList.remove('correct','wrong');
    if (i === correct) el.classList.add('correct');
    else if (i === oi && oi !== correct) el.classList.add('wrong');
  });
  showExplain(lessonId, qi);
}

function showExplain(lessonId, qi) {
  document.getElementById(`explain-${lessonId}-${qi}`)?.classList.add('show');
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
renderLessons();
renderNavBar();
renderSidebar();
</script>
</body>
</html>
