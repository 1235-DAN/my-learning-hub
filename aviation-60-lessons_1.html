/* =====================================================================
   2. LESSONS 陣列 — 先用大綱標題產生 60 筆「未生成」骨架

const LESSONS = [];

  unit.titles.forEach((title, i) => {
    LESSONS.push({
      id: start + i,

/* ---------------------------------------------------------------------
   3. 第 1 回：完整內容
   --------------------------------------------------------------------- */
LESSONS[0].subtitle = "從伯努利定律與牛頓第三定律的統一視角理解升力";
LESSONS[0].content = `
<h2>觀念拆解</h2>
<p>一架波音 747 空重近 180 噸，為什麼一片薄薄的機翼能撐起它？常見解釋「上表面弧度較大、氣流較快、壓力較低」並不完整。完整的物理圖像需要同時理解兩件事：</p>
<p>(1) <b>牛頓第三定律視角</b>：機翼把大量空氣向下偏轉（downwash），根據作用力與反作用力，空氣同時給機翼一個向上的反作用力，這是升力的主要來源。</p>
<p>(2) <b>伯努利定律視角</b>：機翼上表面氣流加速、壓力降低，下表面壓力相對較高，這個壓力差積分起來也貢獻升力。這兩者其實是同一個物理現象的兩種描述方式，不是互斥的競爭理論。</p>
<div class="callout analogy">🔍 日常生活類比：把手伸出行駛中汽車窗外，手掌微微上揚（正攻角），會感覺手被往上推——這其實就是縮小版的升力產生機制：手把迎面而來的空氣向下偏轉，空氣反過來把手往上推。</div>
<h2>專業術語卡</h2>
<div class="term-grid">
  <div class="term"><b>Lift 升力</b>垂直於相對氣流方向、支撐飛機重量的空氣動力</div>
  <div class="term"><b>Angle of Attack 攻角</b>機翼弦線與相對氣流方向之間的夾角</div>
  <div class="term"><b>Bernoulli's Principle 伯努利定律</b>流速增加時，流體壓力隨之下降的能量守恆關係</div>
  <div class="term"><b>Downwash 下洗流</b>機翼後方被向下偏轉的氣流，是升力反作用力來源</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：機長在起飛前透過拉升機頭增加攻角，讓機翼偏轉更多氣流以產生足夠升力離地。但攻角不能無限增加——超過臨界攻角（Critical AoA），氣流會在機翼上表面分離，升力驟降，這就是失速（Stall）。這也是為什麼失速警告系統監控的是攻角，而不是空速。</div>
<div class="callout summary">📌 課堂總結：升力不是單一公式能完全解釋的現象，而是牛頓第三定律（空氣被向下偏轉）與伯努利定律（壓力差）兩種視角的統一描述。攻角是控制升力大小的關鍵變數，但存在臨界值——超過臨界攻角就會失速。</div>
<h2>示意圖</h2>
<div class="diagram-box">        相對氣流
           ------&gt;
              \\
               \\  攻角(α)
    ____________\\________
   /              機翼弦線
  (機翼剖面，上表面弧度較大)
   \\____________________

   上表面：氣流加速 → 壓力↓
   下表面：氣流較慢 → 壓力↑
   氣流整體被向下偏轉 (downwash)
        ↓ ↓ ↓
   升力 = 壓力差貢獻 + 動量反作用力貢獻</div>
`;
LESSONS[0].quizzes = [
  { q:"1. 關於升力的產生，以下敘述何者最準確？",

LESSONS[2].content = `
<h2>觀念拆解</h2>
<p>飛機在空中飛行受到的阻力，可以拆成兩大家族：<b>寄生阻力（Parasite Drag）</b>與<b>誘導阻力（Induced Drag）</b>。寄生阻力又可再細分三種面孔：</p>
<p>(1) <b>摩擦阻力（Skin Friction Drag）</b>：空氣分子與機身表面摩擦產生的阻力，表面越粗糙、面積越大，摩擦阻力越大。</p>
<p>(2) <b>形狀阻力（Form / Pressure Drag）</b>：物體形狀造成前後壓力差所產生的阻力，越不流線型（如固定式起落架）形狀阻力越大。</p>
<p>(3) <b>干擾阻力（Interference Drag）</b>：兩個構件交會處（如機翼與機身接合處）氣流互相干擾所產生的額外阻力，通常需要整流罩（fairing）來減少。</p>
<p>第四種面孔是<b>誘導阻力（Induced Drag）</b>：這是「產生升力所必須付出的代價」，源自翼尖渦流與下洗流的傾斜效應。攻角越大、速度越低，誘導阻力越大。</p>
<div class="callout analogy">🔍 日常生活類比：騎腳踏車時，低速蛇行搖晃需要不斷施力維持平衡（類似低速大攻角時誘導阻力主宰），但當你騎到高速時，感受到的主要是迎面而來的風阻與輪胎摩擦（類似寄生阻力主宰）——阻力的主角，會隨著速度改變。</div>
<h2>專業術語卡</h2>
<div class="term-grid">
  <div class="term"><b>Parasite Drag 寄生阻力</b>不因升力產生而存在的阻力總稱，包含摩擦、形狀、干擾阻力</div>
  <div class="term"><b>Induced Drag 誘導阻力</b>因產生升力而伴隨產生的阻力，源自翼尖渦流與下洗流</div>
  <div class="term"><b>Skin Friction Drag 摩擦阻力</b>空氣與機身表面摩擦所產生的阻力</div>
  <div class="term"><b>L/D Max 最大升阻比</b>總阻力最小、滑翔效率最佳的飛行速度點</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：當引擎失效需要滑翔迫降時，飛行員會盡量以「最佳滑翔速度」（Best Glide Speed）飛行——這個速度正是總阻力曲線最低點，也就是誘導阻力與寄生阻力恰好取得平衡、升阻比最大的那一點。飛太快，寄生阻力吃掉滑翔距離；飛太慢，誘導阻力反而暴增，同樣縮短滑翔距離。</div>
<div class="callout summary">📌 課堂總結：阻力分為寄生阻力（摩擦、形狀、干擾）與誘導阻力兩大類，前者隨速度增加而增加，後者隨速度增加而減少，兩者加總呈 U 型曲線。曲線最低點就是最大升阻比速度，也是引擎失效時的最佳滑翔速度。</div>
<h2>阻力 vs 速度 示意圖</h2>
<div class="diagram-box">阻力

<h2>觀念拆解</h2>
<p>翼型（Airfoil）的剖面幾何決定了它的飛行性格。幾個關鍵定義：<b>弦線（Chord Line）</b>是連接前緣與後緣的直線；<b>弧線（Camber Line）</b>是翼型上下表面的中間平均線；弧線偏離弦線的程度，就是<b>弧度（Camber）</b>。</p>
<p>對稱翼型（symmetric airfoil）的弧線與弦線重合，因此在攻角為 0° 時上下表面壓力對稱、升力為零；<b>弧形翼型（cambered airfoil）</b>則因為弧線本身彎曲，即使攻角為 0°，上下表面依然存在壓力差，升力係數不為零。這代表弧形翼型「天生」就比對稱翼型更容易產生升力。</p>
<p>把升力係數（Cl）對攻角作圖，會得到一條近似線性的曲線（升力曲線），斜率描述攻角變化對升力的敏感度，一直到臨界攻角前都大致線性，之後才如同第 2 回所學，急劇下墜進入失速。</p>
<div class="callout analogy">🔍 日常生活類比：把手掌完全打平放入水中划動（類似對稱翼型），必須傾斜角度才能感受到推力；但如果手掌本身微微彎曲成杯狀（類似弧形翼型），即使打平划動，也已經能感受到一點推力方向的偏移——這就是「固有弧度」帶來的天生優勢。</div>

<h2>觀念拆解</h2>

<p><b>馬赫數（Mach Number, M）</b>= 物體速度 ÷ 當地音速，是判斷是否進入可壓縮流領域的關鍵指標。要注意：音速不是固定值，而是隨溫度變化——海平面約 340 m/s，高空溫度較低，音速也較低（約 295 m/s）。依馬赫數大致分類：次音速（M<0.8）、穿音速（M 0.8–1.2）、超音速（M>1.2）、高超音速（M>5）。</p>

LESSONS[6].content = `
<h2>觀念拆解</h2>
<p>緊貼機翼表面，因為空氣黏滯力的作用，會形成一層速度從「零」（貼壁處，稱為 no-slip condition）漸增到自由流速度的薄層氣流，這就是<b>邊界層（Boundary Layer）</b>。邊界層內的流動又可分兩種狀態：</p>
<p><b>層流（Laminar Flow）</b>：流線平順、分層不混合，摩擦阻力較低，但因為缺乏動量交換，一旦遇到逆壓梯度（如機翼後段），容易提早「分離」。</p>
<p><b>紊流（Turbulent Flow）</b>：流線混亂、夾帶渦流，摩擦阻力較高，但正因為上下層流體不斷混合、交換動量，反而比較能「撐住」不提早分離。邊界層由層流轉變為紊流的位置，稱為<b>轉捩點（Transition Point）</b>。</p>
<p>這裡呼應第 2 回學過的失速：失速的本質就是邊界層分離。而這一回告訴我們，分離發生的早晚，其實跟邊界層是層流還是紊流息息相關。</p>

<p>從這一回開始，我們從空氣動力學轉向<b>結構工程</b>的視角。任何結構在受力時，基本上都在承受四種應力：<b>張力（Tension，拉伸）</b>、<b>壓縮（Compression）</b>、<b>剪力（Shear）</b>與<b>扭力（Torsion）</b>。機身在飛行中同時承受彎曲造成的彎矩、扭轉造成的扭矩，還有加壓艙特有的環向應力（機艙內外壓力差把機身「撐」成一個承壓圓筒）。</p>
<p>現代客機機身普遍採用<b>半硬殼式結構（Semi-monocoque Structure）</b>：由外部蒙皮（skin）、縱向的桁條（stringers）、環向的隔框（frames/bulkheads）共同分擔負載，而不是早期飛機常見的桁架式（truss）結構，也不是完全只靠外皮承重的純硬殼（monocoque）結構。</p>

LESSONS[11].content = `
<h2>觀念拆解</h2>
<p><b>液壓系統（Hydraulic System）</b>的核心物理原理是<b>帕斯卡原理（Pascal's Principle）</b>：密閉液體中任一點的壓力變化，會均勻傳遞到液體的各個角落。這代表如果在一個小活塞上施加壓力，透過連通的液壓油，可以在另一端截面積更大的活塞上產生成比例放大的力——這正是液壓系統能用相對微小的輸入，產生巨大機械力的物理基礎。</p>
<p>典型液壓系統包含幾個核心元件：<b>液壓泵（Hydraulic Pump）</b>負責產生壓力（通常由引擎或電動馬達驅動）、<b>液壓油（Hydraulic Fluid）</b>作為傳遞壓力的介質、<b>作動筒（Actuator）</b>把液壓能轉換成實際的機械運動（推力／拉力）、還有控制閥與儲油箱。</p>
<p>飛機上液壓系統的應用範圍非常廣：起落架收放、飛控面作動、襟翼與縫翼作動、煞車系統、貨艙門等，幾乎無所不在。因為液壓系統對飛控如此關鍵，大型客機通常會配置多套獨立系統作為<b>冗餘設計（Redundancy）</b>，確保單一系統故障時，其他系統仍能維持基本操縱能力。</p>
<div class="callout analogy">🔍 日常生活類比：用手指輕壓一支小注射器的活塞，透過連通的液體管路，可以推動另一端截面積更大的注射器活塞，產生遠超過手指施力的力量——這正是帕斯卡原理最直觀的示範，也是千斤頂能用一個人的力氣抬起一整輛汽車的物理基礎。</div>
<h2>專業術語卡</h2>
<div class="term-grid">

<h2>觀念拆解</h2>
<p>燃油系統（Fuel System）的基本任務是儲存、供輸、管理燃油分配到引擎，現代客機的油箱通常整合在第 10 回學過的機翼翼盒內（wet wing），另外還有位於機身下方、機翼中間段的<b>中央油箱（Center Tank）</b>。</p>
<p>但這一回真正的重點是燃油系統與<b>重心（Center of Gravity, CG）</b>管理的結合。CG 是飛機重量分佈的等效平衡點，必須落在允許的前後範圍內，稱為 <b>CG 包絡線（CG Envelope）</b>。CG 過度前傾（nose-heavy）會增加操縱阻力、使失速速度上升；CG 過度後傾（tail-heavy）則會降低縱向穩定性，甚至可能導致操控困難。</p>
<p>更有趣的是：CG 位置越靠後，水平尾翼為了維持縱向平衡所需提供的向下配平力就越小，因此產生的<b>配平阻力（Trim Drag）</b>也越低——這代表 CG 靠後其實更省油！於是部分大型客機（如空中巴士 A330／A340 系列）設計了主動<b>燃油轉輸系統（Fuel Transfer System）</b>，飛行中把燃油從機翼油箱轉移到水平安定面內的專用配平油箱（Trim Tank），刻意把 CG 移到接近後限附近，藉此降低配平阻力、節省巡航油耗。</p>

<h2>觀念拆解</h2>
<p>隨著高度上升，大氣壓力與氧分壓持續下降。超過約 10,000～12,000 英尺，人體開始出現<b>缺氧（Hypoxia）</b>風險；超過約 25,000 英尺，人體可能在短短數分鐘內失去意識——這段能維持清醒判斷力的時間，稱為<b>有效意識時間（Time of Useful Consciousness, TUC）</b>，高度越高，TUC 越短。</p>
<p>為了讓乘客與機組在高空巡航時仍能正常呼吸，飛機配備<b>加壓艙（Pressurized Cabin）</b>系統：透過引擎抽取的高壓空氣（bleed air，部分現代機型如波音 787 改用電動壓縮機的 no-bleed 架構）持續灌入機艙，並用<b>排氣活門（Outflow Valve）</b>控制排氣速率，維持艙內壓力高於外界大氣壓力。但客機並不會把艙壓維持在海平面標準，而是模擬相當於 <b>6,000～8,000 英尺</b>的環境——這是乘客舒適度與機身結構負擔之間的工程權衡：內外壓力差越大，機身需要承受的環向應力就越大，對結構強度與重量的要求也隨之提高。</p>
<p>若加壓系統失效導致艙壓驟降（Rapid Decompression）或緩慢洩壓，氧氣面罩會在艙內高度達到約 14,000 英尺時自動落下，機組人員必須立即戴上氧氣面罩，並盡快下降到 10,000 英尺以下（此高度人體不需額外供氧仍可維持正常意識）。</p>
<div class="callout analogy">🔍 日常生活類比：搭乘高速電梯或潛水時，耳朵會感受到壓力快速變化帶來的不適——這正是機艙加壓與洩壓過程對人體的縮影；而加壓艙持續灌入空氣以維持內部壓力高於外界，原理就像用打氣筒持續幫輪胎打氣，對抗外界洩壓的趨勢。</div>

  <div class="term"><b>Hypoxia 缺氧</b>因氧氣供應不足導致人體組織缺氧的生理狀態</div>
  <div class="term"><b>Time of Useful Consciousness (TUC) 有效意識時間</b>在特定高度缺氧環境下，人體維持清醒意識與正常判斷力的時間長度</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：2005 年海倫航空 522 號班機（Helios Airways Flight 522）空難，調查發現地勤人員誤將艙壓控制模式設定在手動而非自動，起飛後艙壓系統未能正確加壓，機組人員因缺氧陷入意識不清，飛機最終在自動駕駛下持續飛行直到燃油耗盡墜毀，全機無人生還。這起事故凸顯了正確操作程序確認、氧氣面罩自動落下機制、以及飛行員缺氧警覺訓練的重要性——缺氧的初期症狀往往不易自覺，這正是它格外危險之處。</div>
<div class="callout summary">📌 課堂總結：高空環境對人體構成缺氧風險，加壓艙系統透過持續灌入加壓空氣並控制排氣活門，維持艙內壓力模擬在 6,000～8,000 英尺左右的舒適環境，這是乘客舒適與結構負擔的工程權衡。艙壓失效時，氧氣面罩會自動落下，機組人員需立即戴上面罩並下降高度；而每一次加壓循環，也正是第 9 回學過的機身金屬疲勞累積的根本原因。</div>

LESSONS[16].content = `
<h2>觀念拆解</h2>
<p>飛機最基本的三個飛行儀表——空速、高度、垂直速度，資料來源都仰賴<b>皮托靜壓系統（Pitot-Static System）</b>。這套系統由兩個感測元件構成：<b>皮托管（Pitot Tube）</b>面向氣流方向，量測「全壓」（動壓＋靜壓）；<b>靜壓孔（Static Port）</b>位於機身側面，只量測「純靜壓」。</p>
<p><b>空速指示器（Airspeed Indicator, ASI）</b>的原理很直接：把皮托管量到的全壓，減去靜壓孔量到的靜壓，得到<b>動壓（Dynamic Pressure = ½ρV²）</b>，再依動壓與速度的關係換算並顯示成「指示空速（Indicated Airspeed, IAS）」。</p>
<p>但飛行中談到的「空速」其實有好幾種：<b>IAS</b> 是儀表直接讀數；<b>CAS（校正空速）</b>修正了儀表與感測器位置誤差；<b>TAS（真空速）</b>進一步修正了高度造成的空氣密度差異（同樣的 IAS，在高空對應的 TAS 會更快，因為空氣稀薄，需要更快的實際速度才能產生相同的動壓）；<b>GS（地速）</b>則是 TAS 再疊加上風的向量效應，代表飛機相對地面的實際移動速度。</p>
<div class="callout analogy">🔍 日常生活類比：把手伸出行駛中汽車窗外（回想第1回的類比），手掌感受到的風壓大小，正對應皮托管感受到的全壓——車速越快，風壓越明顯；而車廂內部的環境氣壓則類似靜壓孔量到的靜壓，作為比較基準。兩者相減，就是那股「額外的風壓」，對應到空速讀數。</div>

  <div class="term"><b>Indicated Airspeed (IAS) 指示空速</b>空速指示器直接顯示、未經校正的讀數</div>
  <div class="term"><b>True Airspeed (TAS) 真空速</b>修正高度空氣密度差異後，飛機相對於周圍空氣的實際移動速度</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：2009 年法國航空 447 號班機從里約熱內盧飛往巴黎途中，在大西洋上空遭遇積冰，導致三具皮托管同時結冰堵塞，空速指示器讀數異常，自動駕駛隨即解除。機組人員在缺乏可靠空速資訊、又處於夜間高空缺乏外部視覺參考的情況下，誤判情勢並持續拉杆，最終使飛機進入失速並墜海，機上人員全數罹難。此事故促使業界重新檢討皮托管防冰標準，也再次呼應第 2 回的核心觀念：即使空速讀數不可靠，攻角仍是判斷是否接近失速邊界的根本依據。</div>
<div class="callout summary">📌 課堂總結：空速指示器透過皮托管（全壓）與靜壓孔（靜壓）相減得到動壓，轉換顯示為指示空速。IAS、CAS、TAS、GS 四種空速定義反映了儀表誤差、空氣密度、風速等不同層次的修正。皮托管結冰是重大飛安風險，法航 447 事故正是這個系統性弱點造成的慘痛教訓，也提醒飛行員在儀表資訊不可靠時，應回歸攻角與姿態的基本判斷。</div>
<h2>皮托靜壓系統 示意圖</h2>
<div class="diagram-box">          ➜➜➜ 相對氣流

機身側面 ○ 靜壓孔 ──純靜壓──┐      ┌──────────┐
                            ├─────▶│空速指示器│ (全壓-靜壓=動壓→IAS)

                            │      ┌──────────┐
                            └─────▶│ 高度計    │ (下一回主題)
                                   └──────────┘</div>
`;

<h2>觀念拆解</h2>
<p><b>高度計（Altimeter）</b>本質上是一個經過校準的氣壓計（aneroid barometer）：利用靜壓孔量到的靜壓，依據氣壓隨高度遞減的已知關係（國際標準大氣模型，ISA），反推並顯示出高度讀數。</p>
<p>但「高度」這個數字並非絕對，而是取決於你設定的<b>氣壓基準（Altimeter Setting）</b>，主要有三種模式：</p>
<p><b>QNH</b>：以海平面氣壓為基準，高度計顯示的是「海拔高度」，用於起降與大部分低空航線飛行。</p>
<p><b>QFE</b>：以機場跑道當地氣壓為基準，飛機在地面時高度計會顯示 0，代表「相對機場的高度」，部分國家或機場採用。</p>
<p><b>QNE（標準基準，Standard Setting，29.92 inHg／1013.25 hPa）</b>：使用固定的標準大氣壓基準，飛機爬升通過一個稱為<b>轉換高度（Transition Altitude）</b>的門檻後（各國規定不同，常見約 18,000 英尺），所有飛機統一切換到這個標準基準，此時顯示的不再是「高度」而是「飛行高度層（Flight Level）」，確保所有飛機無論實際所在地區氣壓如何，都用同一套基準飛行，維持彼此之間的垂直安全間隔。</p>
<div class="callout analogy">🔍 日常生活類比：QNH、QFE、QNE 的差別，就像不同地區的人用不同的「零點」來描述高度——有人以海平面為 0（QNH），有人以自家門口地面為 0（QFE）。如果雙方沒有先講好用哪一套基準溝通，「我在 100 公尺高的地方」這句話就會產生嚴重誤解——這正是統一使用 QNE 標準基準飛行的核心理由。</div>

  <div class="term"><b>QNE (Standard Setting)</b>標準大氣壓基準（29.92 inHg/1013.25 hPa），用於高空巡航，顯示飛行高度層</div>
  <div class="term"><b>Transition Altitude 轉換高度</b>從 QNH 切換至 QNE 標準基準的高度門檻，各國／機場規定不同</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：民航機爬升通過轉換高度時，機組人員會將高度計基準從 QNH 切換為標準的 QNE（29.92 inHg），此後在該高度層以上飛行的所有飛機，無論實際海平面氣壓為何，都使用同一套標準基準，確保不同飛機間的垂直間隔判讀一致，這是空中交通管制垂直間隔安全的基石；下降準備進場時則會反向切換回 QNH，取得正確的海拔高度資訊以安全落地。忘記切換基準或輸入錯誤氣壓值，曾是多起「可控飛行撞地（CFIT）」事故的成因之一。</div>
<div class="callout summary">📌 課堂總結：高度計本質是校準過的氣壓計，利用靜壓換算高度。QNH 顯示海拔高度用於起降，QNE 標準基準用於高空巡航以確保所有飛機使用統一基準維持垂直間隔安全，QFE 則顯示相對機場高度。氣壓基準設定錯誤是嚴重的飛安風險，正確切換基準的時機與程序是飛行員訓練的重要環節。</div>
<h2>QNH / QFE / QNE 基準比較 示意圖</h2>
<div class="diagram-box">高度層(Flight Level) ────────────── QNE標準基準(29.92 inHg)

海拔高度 ──────────────────────────  → 顯示"海拔高度"，用於起降
        │
機場地面 ══════════════════════════  QFE(當地基準，地面顯示為0)</div>

<h2>觀念拆解</h2>
<p><b>陀螺儀（Gyroscope）</b>之所以能在飛行儀表中扮演關鍵角色，源自高速旋轉物體的兩個反直覺物理特性：</p>
<p><b>剛性（Rigidity in Space）</b>：旋轉中的物體會傾向維持其旋轉軸方向不變，不容易被外力輕易改變方向——陀螺轉得越快，這個特性越明顯。</p>
<p><b>進動性（Precession）</b>：如果對一個旋轉中的陀螺施加外力，它的反應不會直接出現在施力方向，而是出現在旋轉方向<b>「90 度之後」</b>的位置，這是角動量守恆帶來的反直覺現象。</p>
<p><b>姿態儀（Attitude Indicator, AI）</b>正是利用陀螺儀的剛性特性：內部一個高速旋轉的陀螺維持相對地面水平的穩定參考基準，無論飛機如何滾轉、俯仰，陀螺軸保持不變，儀表據此顯示飛機相對地平線的姿態（俯仰角與滾轉角）。傳統機械式陀螺儀依賴真空幫浦或電力驅動旋轉，現代客機則多已改用<b>雷射環形陀螺儀（Ring Laser Gyroscope）</b>或光纖陀螺儀，沒有實體旋轉質量，利用光學效應偵測旋轉，精度更高也沒有機械磨損問題。</p>
<div class="callout analogy">🔍 日常生活類比：騎腳踏車時，高速轉動的車輪本身具有一種穩定性，車輪轉得越快，越不容易被外力扳倒方向——這正是剛性的直觀體驗；而陀螺玩具被輕輕一推時，倒下的方向往往不是直接朝推力方向，而是偏轉了 90 度左右，這正是進動性最經典的示範。</div>

</div>

<h2>觀念拆解</h2>
<p><b>磁羅盤（Magnetic Compass）</b>是飛機上最古老、最基本、也是唯一不需要電力就能運作的導航儀表：內部磁性指針感應地球磁場，對齊地磁方向指示<b>磁北（Magnetic North）</b>。正因為完全不依賴電力，磁羅盤成為所有電子系統失效時最後的方向備援。</p>
<p>但磁羅盤有兩個必須理解的限制。第一是<b>磁差（Magnetic Variation）</b>：地磁北極與地理真北極（True North）並不重合，不同地理位置的磁差角度也不同，飛行計畫需要在「真航向」與「磁航向」之間換算修正。第二是<b>磁羅盤誤差（Compass Errors）</b>：飛機加減速或轉彎通過南北向航向附近時，磁羅盤指針會因本身慣性與磁傾角效應出現暫時性讀數誤差（北半球常見口訣「ANDS」：加速時北轉 Accelerate North、減速時南轉 Decelerate South）。</p>
<p>為了避免這類暫態誤差，飛機另外配備<b>航向指示器（Heading Indicator, HI）</b>：利用第 19 回學到的陀螺儀剛性特性，提供不受加減速影響的穩定航向參考。但陀螺儀本身沒有磁性感知能力，長時間運作會因地球自轉與內部摩擦產生緩慢漂移，因此需要飛行員定期對照磁羅盤讀數重新校正。</p>

LESSONS[20].content = `
<h2>觀念拆解</h2>
<p><b>VOR（VHF Omnidirectional Range，特高頻全向信標）</b>是地面發射台以 360 度全方位發射兩種訊號：一個全向同步的<b>參考相位訊號</b>，以及一個隨方位角旋轉的<b>可變相位訊號</b>。飛機接收機比較這兩個訊號的相位差，就能計算出飛機相對於這座 VOR 台的方位角，稱為<b>方位線（Radial）</b>。</p>
<p><b>DME（Distance Measuring Equipment，測距儀）</b>則用另一種方式取得資訊：飛機發射詢問脈衝訊號，地面應答器接收後立即回覆，飛機測量這往返的時間差，換算出與地面台之間的<b>斜距（Slant Range）</b>——注意這是空間中的直線距離，而非水平地面投影距離。</p>
<p>VOR 與 DME 常合併設置為 VOR/DME 台，同時提供方位角與距離資訊，讓飛行員能在地圖上用「極座標」的方式精確定位自己的位置。但 VOR 訊號屬於<b>視距（Line-of-Sight）</b>傳播，會被地形遮蔽、也受地球曲率限制，因此低空或山區訊號容易受阻；隨著 GPS／RNAV 技術普及，許多國家已開始逐步減少地面 VOR 站的數量。</p>
<div class="callout analogy">🔍 日常生活類比：想像一座燈塔以固定速度旋轉探照燈，每次燈光通過正北方向時會同步發出一次閃光信號。如果你能測量探照燈光束通過你所在方位、與那次「正北閃光」之間的時間差，就能推算出你相對燈塔的方位角——這正是 VOR 相位比較定位原理的簡化版本。DME 則像聲納回聲定位：發出訊號後測量回音返回的時間，換算成距離。</div>
<h2>專業術語卡</h2>
<div class="term-grid">

LESSONS[21].subtitle = "從固定航路到自由航跡：衛星如何解放飛機的路線";
LESSONS[21].content = `
<h2>觀念拆解</h2>
<p><b>GPS（Global Positioning System）</b>的定位原理是：接收機同時接收至少 4 顆衛星的訊號，利用訊號傳播的時間差計算出接收機與各衛星之間的距離（稱為偽距，pseudorange），再透過<b>三邊測量（Trilateration）</b>原理，解算出接收機的三維位置（經緯度＋高度）與精確時間。</p>
<p>單純 GPS 訊號可能有數公尺至十幾公尺的誤差，且容易受電離層延遲、多路徑效應、訊號遮蔽、甚至刻意干擾／欺騙（jamming／spoofing）影響。為此發展出<b>SBAS（Satellite-Based Augmentation System，衛星增強系統，如美國 WAAS、歐洲 EGNOS）</b>，透過額外的校正訊號將精度提升到公尺級，足以滿足精密進場需求。</p>
<p><b>RNAV（Area Navigation，區域導航）</b>則帶來了導航概念上的根本轉變：不同於傳統 VOR/DME 需要飛機直接朝向或遠離地面電台飛行，RNAV 允許飛機依機載導航系統（可整合 GPS、慣性導航、VOR/DME 等多重來源）計算出的任意航跡點（waypoint）飛行，不受地面電台位置限制，大幅提升航路彈性與空域使用效率。<b>RNP（Required Navigation Performance）</b>更進一步要求飛機具備即時監控自身導航精度是否達標的能力。</p>
<div class="callout analogy">🔍 日常生活類比：GPS 的三邊測量原理，就像三個人分別測量出你與他們之間的距離，三個距離圓圈的交會點即可鎖定你的確切位置（實務上需要第四個距離資訊來同時解算時鐘誤差，所以至少需要 4 顆衛星）。而 RNAV 允許自由航跡點飛行，就像從「必須沿著固定道路網行走」（VOR/DME 航路），轉變成「可以在開闊地圖上自由規劃任意路徑點行走」（GPS/RNAV 航跡點），路徑彈性大幅提升。</div>

  <div class="term"><b>Trilateration 三邊測量</b>利用至少三個（實務上四個）已知距離，解算出未知點精確位置的數學方法</div>
  <div class="term"><b>RNAV (Area Navigation) 區域導航</b>允許飛機依機載系統計算的任意航跡點飛行，不受限於地面電台位置的導航方式</div>
  <div class="term"><b>RNP (Required Navigation Performance) 所需導航性能</b>要求飛機具備即時監控自身導航精度是否達標能力的導航規範</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：現代客機的飛行管理系統（FMS）採用多重感測器資料融合（GPS＋慣性導航系統 IRS＋VOR/DME 等），而非單純依賴 GPS，正是為了因應 GPS 訊號可能受到干擾、遮蔽甚至惡意欺騙的風險——這與第 14 回電力系統多重備援、第 20 回磁羅盤／航向指示器互補校正的設計哲學一脈相承。RNAV／RNP 精密進場程序也讓飛機能在沒有地面 ILS 設備的機場（如許多山區機場）仍能執行精確的儀器進場，大幅提升航路與進場的彈性與安全性。</div>

`;

<h2>觀念拆解</h2>
<p><b>ILS（Instrument Landing System，儀器降落系統）</b>由兩組地面無線電發射系統構成，共同引導飛機沿著一條精確的三維路徑進場降落：</p>
<p><b>定位台（Localizer, LOC）</b>：通常架設在跑道遠端，發射兩個略微重疊、調變頻率不同（90Hz 與 150Hz）的波束，飛機接收機比較兩訊號的強度差異，判斷自身相對跑道中心線是偏左還是偏右，提供<b>水平方向</b>的引導。</p>
<p><b>下滑道台（Glide Slope, GS）</b>：架設在跑道側邊接近觸地點的位置，同樣利用兩個調變頻率波束疊加的原理，提供<b>垂直方向</b>的高低偏移引導，標準下滑角通常設定為 3 度。</p>
<p>ILS 依系統精度與允許的最低天氣標準分為不同等級（CAT I／II／III），核心指標是<b>決斷高度（Decision Height, DH）</b>——飛行員必須在這個高度決定是否已能看見跑道並繼續降落，或必須重飛。CAT I 為基本等級（決斷高度約 200 英尺），CAT III 是最精密的等級，部分甚至可支援決斷高度低至 0 英尺的「零視距」<b>自動降落（Autoland）</b>，搭配自動油門與自動駕駛完成整個降落過程。</p>
<div class="callout analogy">🔍 日常生活類比：定位台的左右引導，就像騎自行車沿著地上畫的中線行駛——感應到偏左就提示往右修正，偏右則提示往左修正；下滑道台的垂直引導，則像滑雪場的理想滑降路線指示，告訴你目前是「太高需要往下靠近路線」還是「太低需要拉高」。兩者結合，就像同時有水平與垂直兩條參考線交織成一條精確的三維走廊，引導飛機準確飛向跑道。</div>

  <div class="term"><b>Autoland 自動降落</b>搭配 CAT III 等級 ILS 與自動駕駛/自動油門系統，飛機自動完成整個進場降落過程</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：在低能見度天氣（如濃霧）下，CAT III 等級 ILS 搭配自動降落系統讓客機仍能安全降落，大幅提升機場在惡劣天氣下的可用性。但 ILS 訊號同樣是視距限制的地面系統，且需要精密校驗維護，近年來 GPS/RNAV 精密進場技術（如 GLS，GBAS Landing System）逐漸發展成熟，被視為未來可能補充甚至部分取代傳統 ILS 的技術路徑，但目前 ILS 仍是全球絕大多數機場精密進場的主要標準。</div>

LESSONS[24].subtitle = "從地表到平流層：飛機飛行的舞台是怎麼分層的";
LESSONS[24].content = `
<h2>觀念拆解</h2>
<p>大氣可以概略分成幾層。緊貼地表的<b>對流層（Troposphere）</b>從地面延伸到約 36,000 英尺（約 11 公里），溫度隨高度遞減，幾乎所有天氣現象（雲、雨、亂流、雷雨）都發生在這一層。對流層之上是<b>對流層頂（Tropopause）</b>，也就是對流層與<b>平流層（Stratosphere）</b>的交界處；進入平流層後，溫度反而隨高度略微上升（因為臭氧層吸收紫外線），氣流相對穩定，客機巡航常選在對流層頂附近或平流層底部飛行，正是為了避開下方對流層中較劇烈的天氣擾動。</p>
<p>為了讓全球飛機性能計算與儀表校準有一套共通基準，業界訂定了<b>國際標準大氣（International Standard Atmosphere, ISA）</b>：海平面標準溫度 15°C、標準氣壓 1013.25 hPa（29.92 inHg），溫度以固定遞減率（約每 1,000 英尺下降 2°C）持續下降，直到對流層頂（約 36,000 英尺，-56.5°C），之後在平流層內保持恆溫一段高度範圍。這正是第 18 回學過的 QNE 標準基準（29.92 inHg）的理論來源。</p>
<p>當實際大氣狀況（溫度、氣壓）偏離 ISA 標準時，會產生<b>密度高度（Density Altitude）</b>的概念——把實際的空氣密度，對應到標準大氣中「相當於哪個高度」。溫度越高於標準、氣壓越低，密度高度就會高於實際海拔，代表空氣更稀薄，直接影響引擎功率、螺旋槳效率與機翼升力表現。</p>
<div class="callout analogy">🔍 日常生活類比：大氣分層有點像蛋糕的分層結構——底層（對流層）溫度變化劇烈、天氣現象豐富，上層（平流層）則相對平靜穩定。密度高度則像「體感溫度」與「實際溫度」的關係：夏天高溫潮濕的機場，即使實際海拔不高，飛機引擎與機翼「感受」到的空氣稀薄程度，卻可能相當於在更高海拔機場起飛，這是一種隱形但關鍵的性能影響。</div>
<h2>專業術語卡</h2>
<div class="term-grid">
  <div class="term"><b>Troposphere 對流層</b>地表至約36,000英尺，溫度隨高度遞減，幾乎所有天氣現象發生的大氣層</div>
  <div class="term"><b>Tropopause 對流層頂</b>對流層與平流層的交界處，溫度遞減趨勢在此終止</div>
  <div class="term"><b>ISA (International Standard Atmosphere) 國際標準大氣</b>訂定海平面標準溫度15°C、氣壓1013.25 hPa及固定溫度遞減率的理論大氣模型</div>
  <div class="term"><b>Density Altitude 密度高度</b>將實際空氣密度對應到標準大氣中相當高度的概念，直接影響飛機性能</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：高海拔、高溫、潮濕的機場（如南美洲高原機場或夏季沙漠機場）常面臨高密度高度問題——即使實際海拔相同，炎熱天氣下的密度高度可能遠高於實際海拔，導致引擎推力、螺旋槳效率、機翼升力表現全面下降，飛機起飛距離顯著增加、爬升率下降。飛行員必須依據當日密度高度重新計算起飛性能數據，這是每次飛行前性能計算（Performance Calculation）不可或缺的一環，忽略此因素曾是多起高原機場起飛事故的成因。</div>
<div class="callout summary">📌 課堂總結：大氣可分對流層（天氣現象發生處）、對流層頂、平流層（相對穩定，客機常巡航於此），國際標準大氣（ISA）是所有飛機性能計算與高度計校準的理論基準。密度高度描述實際大氣狀況偏離 ISA 標準時，空氣密度相當於標準大氣中的哪個高度，直接影響引擎功率與機翼升力表現，是飛行前性能計算的關鍵考量。</div>

      海平面 15°C, 1013.25 hPa (ISA標準)</div>
`;

LESSONS[25].content = `
<h2>觀念拆解</h2>
<p>風的本質，是空氣從高壓區流向低壓區、試圖平衡壓力差的運動。驅動這個運動的根本力量稱為<b>氣壓梯度力（Pressure Gradient Force）</b>——由高壓指向低壓。在天氣圖上，連接氣壓相同各點的連線稱為<b>等壓線（Isobar）</b>，等壓線越密集，代表氣壓梯度越大，對應的風速也越強。</p>
<p>但如果風真的只由氣壓梯度力驅動，理論上應該直直從高壓吹向低壓。實際上並非如此，原因是<b>科氏力（Coriolis Force）</b>：地球自轉導致移動中的空氣（及任何物體）在北半球向右偏轉、南半球向左偏轉。這解釋了為什麼北半球的高壓系統會呈現順時針輻散、低壓系統呈現逆時針輻合——風並非直線吹向低壓，而是繞著高低壓系統呈曲線路徑流動。</p>
<p>當氣壓梯度力與科氏力達到平衡時，風會沿著等壓線方向穩定吹拂，而不是垂直穿越等壓線，這種風稱為<b>地轉風（Geostrophic Wind）</b>，是高空自由大氣中風場的基本模式（近地面則因摩擦力影響，風向會與等壓線略有夾角）。</p>
<div class="callout analogy">🔍 日常生活類比：氣壓梯度力驅動風，就像水從高處流向低處以消除位能差；科氏力效應則像在旋轉的旋轉木馬上丟球——即使你朝正前方直線丟出，旁觀者從外部看，會看到球的軌跡呈現彎曲路徑。這正是科氏力「看似真實存在，實際上是參考座標系本身在旋轉」所造成的效應。</div>

  <div class="term"><b>Coriolis Force 科氏力</b>因地球自轉，使移動物體（如空氣）在北半球向右偏、南半球向左偏的視覺偏轉效應</div>
  <div class="term"><b>Geostrophic Wind 地轉風</b>氣壓梯度力與科氏力達到平衡時，風沿等壓線方向穩定吹拂的風場模式</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：飛行員在解讀航空氣象圖（如地面天氣圖上的等壓線分布）時，可透過等壓線的密集程度快速判斷該區域風速強弱，並運用「背風而立、低壓在左手邊」（白貝羅定律，Buys Ballot's Law，北半球適用）的經驗法則快速判斷高低壓系統相對位置。高空飛行時，噴射氣流（Jet Stream，將在後續回次深入介紹）正是地轉風原理在對流層頂附近的極致展現，飛行員善用順風噴射氣流可大幅縮短飛行時間、節省燃油。</div>
<div class="callout summary">📌 課堂總結：風的形成源自氣壓梯度力驅動空氣從高壓流向低壓，但地球自轉產生的科氏力使風路徑產生偏轉，兩者平衡時形成沿等壓線吹拂的地轉風。理解氣壓系統與風場模式，是解讀天氣圖、規劃航路、善用順風減少油耗的基礎。</div>

    而是受科氏力偏轉成曲線路徑)          ←── 科氏力(北半球向右)</div>

<p><b>亂流（Turbulence）</b>的成因主要可分三大類：<b>對流性亂流（Convective Turbulence）</b>由積雨雲等劇烈對流活動引起，通常最為劇烈（呼應第 27 回）；<b>機械性亂流（Mechanical Turbulence）</b>由地形（如山脈）或建築物阻擋氣流形成的紊亂氣流，典型例子是<b>山岳波（Mountain Wave）</b>；<b>風切變相關亂流（Wind Shear Turbulence）</b>則包括發生在噴射氣流邊緣的<b>晴空亂流（Clear Air Turbulence, CAT）</b>以及低空風切變。</p>
<p>晴空亂流最特殊也最危險的地方，在於它發生在完全無雲、目視條件良好的高空，通常與噴射氣流邊緣風速梯度的劇烈變化有關。因為缺乏雲層等視覺警示，CAT 很難事先目視察覺，是造成客機在巡航階段突發顛簸、甚至讓未繫安全帶乘客受傷的常見原因。</p>

<h2>觀念拆解</h2>
<p>積冰（Icing）的成因來自<b>過冷水滴（Supercooled Water Droplets）</b>——溫度已低於 0°C，卻因為缺乏凝結核而仍保持液態的水滴，常見於雲層或降水中。當這些「不穩定的液態水」一接觸到溫度同樣在冰點以下的飛機表面，會瞬間凍結附著，形成積冰。</p>
<p>依形成速度與外觀，積冰可分兩大類：<b>霧淞冰（Rime Ice）</b>由小型過冷水滴快速凍結形成，外觀粗糙不透明、呈白色，常見於層雲中；<b>明冰（Clear Ice）</b>則由較大過冷水滴緩慢凍結形成，外觀光滑透明、附著力強且難以去除，常見於積雨雲或凍雨中，是對飛行危害最大的積冰類型。</p>
<p>積冰的危害是多層次的：它會改變機翼原本設計的翼型形狀（回想第 4 回的弧度與升力曲線），破壞氣流分佈，導致升力係數下降、失速攻角提前（也就是失速速度上升），同時增加重量與阻力；若積冰堆積在皮托管（回想第 17 回），會導致空速讀數異常；積冰也可能堵塞引擎進氣口，影響推力輸出。</p>
<div class="callout analogy">🔍 日常生活類比：過冷水滴接觸飛機表面瞬間結冰的現象，就像把純淨水放入冷凍庫卻因為水質純淨而遲遲未結冰（過冷狀態），一旦搖晃或碰撞容器，水會瞬間整個結凍；明冰難以去除的特性，則像玻璃窗上緩慢形成的透明冰層，比起快速形成的白霜（霧淞冰）更難刮除，附著力也更強。</div>

  <div class="term"><b>Rime Ice 霧淞冰</b>由小型過冷水滴快速凍結形成，外觀粗糙不透明的積冰</div>
  <div class="term"><b>Clear Ice 明冰</b>由較大過冷水滴緩慢凍結形成，外觀光滑透明、附著力強、危害最大的積冰</div>
  <div class="term"><b>Anti-icing / De-icing 防冰/除冰系統</b>防冰系統在積冰形成前主動預防，除冰系統則清除已形成的積冰</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：1994 年美國鷹航 4184 號班機空難，調查發現飛機在等待進場盤旋時機翼前緣形成明冰，改變翼型導致升力特性劇變，加上襟翼放下時氣流分佈進一步惡化，最終導致飛機失控墜毀，此事故直接促成小型渦槳飛機除冰系統設計標準的重大修訂。法航 447 事故（第17回）部分肇因也與皮托管積冰有關，顯示積冰是橫跨飛機多個系統（翼型、儀表、引擎）的系統性飛安威脅。</div>
<div class="callout summary">📌 課堂總結：積冰源自過冷水滴接觸飛機表面瞬間凍結，依形成速度與外觀分為霧淞冰（粗糙易處理）與明冰（光滑難除、危害最大）。積冰會改變翼型、增加失速風險、影響儀表讀數、甚至堵塞引擎進氣，防冰系統主動預防、除冰系統清除已形成積冰，兩者搭配地面除冰作業構成完整的積冰防護體系。</div>

LESSONS[29].content = `
<h2>觀念拆解</h2>
<p>雷雨（Thunderstorm）的生命週期分三個階段：<b>發展階段（Cumulus Stage）</b>持續有上升氣流，雲不斷向上發展；<b>成熟階段（Mature Stage）</b>雲內同時存在上升與下降氣流，開始降雨降雹、出現閃電雷聲，是整個生命週期中最危險的階段；<b>消散階段（Dissipating Stage）</b>下降氣流主導，上升氣流減弱，降雨逐漸停止。雷雨的形成需要三個要素同時具備：水氣（Moisture）、不穩定大氣（Instability）、以及抬升機制（Lifting Mechanism，如鋒面、地形、日照加熱地表產生的熱力對流）。</p>
<p>雷雨成熟階段中最致命的現象之一，是<b>微下衝流（Microburst）</b>：強烈下降氣流衝擊地面後向四周擴散。飛機若在起飛或降落階段（低空、低速、餘裕有限）不幸遭遇，會經歷一連串劇烈變化：先是強烈<b>逆風</b>（升力暫時增加，飛行員可能誤判而減少推力），接著急速轉為強烈<b>順風與下降氣流</b>（升力驟減、下降率暴增）。這種短時間內風向風速劇烈轉變的現象，稱為<b>風切變（Wind Shear）</b>，是低空進場與起飛階段最致命的天氣威脅之一。</p>
<p>現代客機配備機載風切變偵測系統，機場則有都卜勒氣象雷達（Doppler Weather Radar）協助預警。一旦收到風切變警告，標準應對程序是立即執行<b>風切變逃逸機動（Windshear Escape Maneuver）</b>：全推力爬升、維持特定攻角姿態，而不是試圖繼續降落。</p>
<div class="callout analogy">🔍 日常生活類比：微下衝流的風切變效應，就像從高處倒下一桶水，水落到地面後會向四周噴濺散開。飛機穿越微下衝流時經歷「先逆風、後順風」的過程，正如同站在水桶下方的人，一開始感受到水柱直接衝擊向上的水花（逆風效應），接著水流向四周擴散離開（順風效應）——整個過程劇烈且短暫，正是它格外危險的原因。</div>

<h2>觀念拆解</h2>
<p><b>噴射氣流（Jet Stream）</b>是對流層頂附近（約 30,000～40,000 英尺）一條狹窄、高速的西風帶氣流。它的成因正是第 26 回學過的物理原理的延伸：不同緯度間的溫度梯度（特別是極地與副熱帶氣團交界處）造成強烈的氣壓梯度，加上科氏力作用，形成如同河流般狹長高速的氣流帶，風速可達每小時 100～200 海里以上，甚至更強。</p>
<p>噴射氣流主要分兩類：<b>極地噴射氣流（Polar Jet）</b>緯度較高、風速變化較大，且位置隨季節南北移動；<b>副熱帶噴射氣流（Subtropical Jet）</b>緯度較低、相對穩定。兩者交互作用，深刻影響中緯度地區天氣系統的移動與強度。</p>
<p>噴射氣流對飛行有非常實務的影響：<b>順風（Tailwind）</b>飛行時善用噴射氣流可大幅縮短飛行時間、節省燃油（例如從北美飛往歐洲的航班常刻意規劃航路借助噴射氣流順風）；<b>逆風（Headwind）</b>飛行則需盡量避開噴射氣流核心區域，以減少燃油消耗與飛行時間。而噴射氣流邊緣的強烈風速梯度，正是第 28 回學過的<b>晴空亂流（CAT）</b>的主要成因之一。</p>
<div class="callout analogy">🔍 日常生活類比：噴射氣流就像大氣中一條隱形的高速公路——不同緯度氣團交界處因溫差產生的壓力差，加上科氏力偏轉，形塑出這條狹長高速氣流帶。順著噴射氣流飛行，就像在高速公路上順向行駛，能大幅提升相對地面的移動速度；逆向飛行則像逆向行駛在高速公路上，阻力（逆風）大幅增加。</div>

LESSONS[32].subtitle = "升力、重力、推力、阻力：飛機的四方拔河";
LESSONS[32].content = `
<h2>觀念拆解</h2>
<p>飛機在空中同時受四種基本力作用：<b>升力（Lift）</b>向上、由機翼產生；<b>重力（Weight）</b>向下、作用於飛機總重心；<b>推力（Thrust）</b>向前、由引擎產生；<b>阻力（Drag）</b>向後（回想第3回的四種面孔）。在<b>直線等速平飛（Straight and Level Flight）</b>時，四力達到平衡：升力＝重力，推力＝阻力，飛機才能維持等高度、等速度飛行。</p>
<p>但光是力的大小平衡還不夠——<b>作用點位置</b>同樣關鍵。升力作用點稱為<b>壓力中心（Center of Pressure）</b>，會隨攻角變化而移動；若升力、重力、推力、阻力的作用線不通過同一點，會產生<b>力矩（Moment）</b>，使飛機產生旋轉傾向（低頭或抬頭）。水平尾翼提供的配平力（回想第13回的配平阻力）正是用來平衡這些力矩，維持縱向穩定的關鍵機制。</p>
<p>理解四力的動態平衡，是理解接下來爬升、下降、轉彎等所有飛行狀態變化的基礎：升力大於重力時飛機爬升，推力大於阻力時飛機加速——這正是下一回要深入探討的內容。</p>
<div class="callout analogy">🔍 日常生活類比：四力平衡就像蹺蹺板兩端的力量與力臂平衡——不僅要重量相等，力臂位置也要適當才能維持水平；也可以想像四個方向同時拔河，若四方力量相等則保持靜止（等速直線飛行），若某一方力量增加，就會朝該方向移動（加速、爬升等）。</div>
<h2>專業術語卡</h2>
<div class="term-grid">
  <div class="term"><b>Lift/Weight/Thrust/Drag 升力/重力/推力/阻力</b>作用於飛機的四種基本力，分別由機翼、地心引力、引擎、空氣阻力產生</div>
  <div class="term"><b>Straight and Level Flight 直線等速平飛</b>飛機保持等高度、等速度、直線飛行的基本穩定飛行狀態，此時四力達到平衡</div>
  <div class="term"><b>Center of Pressure 壓力中心</b>機翼升力合力的等效作用點，會隨攻角變化而移動</div>
  <div class="term"><b>Moment 力矩</b>力乘以力臂距離，描述力對物體造成旋轉傾向的物理量</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：飛行員在配平（Trim）操作時，實際上就是在微調水平尾翼角度以平衡各種力矩，讓飛機能「放手」仍維持穩定姿態，減少長時間操縱桿施力的疲勞。客機的自動配平系統（Auto-trim）則會隨速度、重量、CG 變化即時調整水平尾翼角度，持續維持四力與力矩的動態平衡——這正與第13回燃油轉輸系統影響 CG 後、配平系統需要相應調整的實務連結一致。</div>
<div class="callout summary">📌 課堂總結：飛機受升力、重力、推力、阻力四種基本力作用，直線等速平飛時四力達到平衡（升力=重力，推力=阻力）。但力的作用點位置同樣重要，力矩不平衡會影響縱向穩定性，水平尾翼配平正是用來維持這個動態平衡的關鍵機制。</div>
<h2>四力平衡 示意圖</h2>

若升力 > 重力 → 爬升 ｜ 若推力 > 阻力 → 加速</div>

LESSONS[33].subtitle = "爬升靠剩餘的力氣，轉彎靠傾斜的升力";
LESSONS[33].content = `
<h2>觀念拆解</h2>
<p><b>爬升力學</b>：穩定爬升時，推力必須大於阻力以維持速度，決定爬升率（Rate of Climb）的關鍵參數是<b>剩餘功率（Excess Power）</b>——推力超過阻力所需功率的部分。剩餘功率越多，爬升率越高。</p>
<p><b>下降力學</b>：分為動力下降（仍有部分推力，下降率可控）與<b>滑翔下降（Glide Descent）</b>（推力為零，完全依賴重力分量與升阻比決定下降率與滑翔距離）。這正是第3回學過的 L/D max 最佳滑翔速度發揮作用的場景。</p>
<p><b>轉彎力學</b>：轉彎需要<b>向心力（Centripetal Force）</b>使飛機改變方向，這個向心力來自升力的水平分量（透過坡度 Bank Angle 傾斜機翼產生）。因此轉彎時升力必須增加，才能同時維持垂直方向的升力平衡與提供水平向心力——這正是第2回學過的「轉彎時升力需求增加、載重因數增加」的力學根源。<b>載重因數（Load Factor, G）</b>描述飛機實際承受的升力相對於重量的倍數，坡度角越大，載重因數越高（如60度坡度時載重因數為2G），失速速度也隨載重因數平方根成正比上升，這正是加速失速的力學基礎。</p>
<div class="callout analogy">🔍 日常生活類比：爬升力學就像騎腳踏車上坡，需要更多踩踏力量（推力）克服重力分量與阻力才能維持速度前進；轉彎力學則像甩動一條繫著球的繩子畫圓，繩子提供的張力就是向心力，若要甩得更快（轉彎坡度更陡），繩子需要承受更大張力（飛機需要更大升力）——這正是轉彎時「感覺變重」（G力增加）的物理根源。</div>
<h2>專業術語卡</h2>
<div class="term-grid">
  <div class="term"><b>Excess Power 剩餘功率</b>推力超過阻力所需功率的部分，決定飛機爬升率的關鍵參數</div>
  <div class="term"><b>Glide Ratio 滑翔比</b>滑翔下降時，水平飛行距離與下降高度的比值，等同於升阻比</div>
  <div class="term"><b>Centripetal Force 向心力</b>使物體沿曲線路徑運動、指向曲線中心的力，轉彎時由升力水平分量提供</div>

<h2>觀念拆解</h2>
<p><b>螺旋（Spin）</b>的本質是「失速＋自轉」的複合狀態，而非單純的快速下降：飛機在失速狀態下，若同時存在不對稱的偏航或滾轉輸入（如失速時單邊機翼先失速），會導致飛機一邊持續失速一邊自轉並螺旋式下降。</p>
<p>螺旋之所以危險，在於它的<b>自我維持特性</b>：進入螺旋時，下降（內側）機翼的有效攻角因自轉角速度疊加而更大、已深度失速使升力更小、阻力更大；上升（外側）機翼攻角相對較小、升力較大。這個升力差異持續驅動<b>自轉（Autorotation）</b>，形成自我維持的螺旋狀態，若不主動介入很難自行改出。</p>
<p>標準的<b>螺旋改出程序（Spin Recovery）</b>通常包含：收油門（降低動力影響）、反方向舵（對抗自轉方向以停止偏航）、機頭適度前推（降低攻角，脫離失速狀態）、副翼維持中立（避免加劇不對稱升力），待轉速停止後緩慢拉平改出俯衝。這套程序需要專門訓練才能正確執行。現代大型客機的飛控系統設計目標之一，正是透過攻角保護律等機制從根本上<b>防止</b>飛機進入螺旋狀態，而非依賴事後改出程序。</p>

<h2>觀念拆解</h2>
<p><b>續航力（Endurance）</b>指飛機能持續飛行的「時間長度」，<b>航程（Range）</b>指飛機能飛行的「距離長度」，兩者計算目標不同，對應的最佳飛行速度也不同。<b>最大續航力速度</b>通常對應「單位時間耗油量最低」的速度（接近 L/D max 速度附近）；<b>最大航程速度</b>則需要同時考量速度與耗油率的乘積效益，通常對應比最大續航力速度略快一些的速度點——因為飛得快一點雖然單位時間耗油增加，但單位距離耗油反而可能更低，直到超過某個平衡點後才轉為不利。噴射客機的長程巡航速度通常設定在接近最大航程速度附近。</p>
<p>完整的<b>燃油計畫（Fuel Planning）</b>除了航路所需的<b>航路燃油（Trip Fuel）</b>外，法規要求額外備妥多重燃油儲備：滑行燃油（Taxi Fuel）、備用場燃油（Alternate Fuel，飛往備降機場所需）、<b>最終儲備燃油（Final Reserve Fuel）</b>（抵達備降機場後仍能維持一定時間待命的最低儲備）、以及應急燃油（Contingency Fuel，因應航路上可能的額外耗油）。</p>
<p>飛行中隨燃油消耗，飛機重量持續減輕，誘導阻力（回想第3回）也隨之降低，因此長程巡航通常採取<b>階梯式爬升（Step Climb）</b>策略，隨重量減輕逐步爬升至更高、更省油的巡航高度——這是續航力/航程計算與飛行力學動態耦合的實務體現。</p>

<p><b>渦輪噴射引擎（Turbojet）</b>的推力產生原理是牛頓第三定律的直接應用：引擎將空氣加速並向後高速噴出，產生的反作用力即為推力（推力＝質量流率×排氣速度變化量）。純渦輪噴射引擎排氣速度極高，適合高速／超音速飛行，但低速時<b>推進效率（Propulsive Efficiency）</b>相對較低、油耗高、噪音大。</p>

<h2>觀念拆解</h2>
<p><b>螺旋槳（Propeller）</b>本質上是旋轉的小型機翼：葉片旋轉時，利用第1回學過的升力原理（牛頓反作用力＋伯努利壓力差）產生的力，方向轉為水平推進方向，即為推力。因為槳尖與槳根的線速度不同（線速度＝角速度×半徑，半徑越大線速度越快），螺旋槳葉片沿長度方向會設計成<b>扭轉（Twist）</b>形狀，確保整片槳葉各處都能維持接近最佳攻角。</p>
<p><b>定距槳（Fixed-Pitch Propeller）</b>槳葉角度固定，只能在特定轉速／空速組合下達到最佳效率，如同汽車只有一個固定齒輪比；<b>變距槳（常見為定速槳，Constant-Speed Propeller）</b>可透過液壓機構（呼應第12回液壓系統概念）調整槳葉角度（螺距），在不同飛行階段（起飛需要低螺距高轉速產生大推力，巡航需要高螺距低轉速維持效率）都能維持接近最佳效率，如同汽車自動變速箱依速度自動換檔。</p>
<p>多發動機飛機若一具引擎故障停俥，可將該側螺旋槳槳葉調整至幾乎與氣流平行的角度（<b>順槳，Feathering</b>），大幅降低該螺旋槳產生的阻力，讓飛機能以剩餘引擎維持較好的爬升／巡航性能。此外，螺旋槳槳尖線速度（自身旋轉速度＋飛機前進速度的向量合成）若接近音速，會如同第6回學過的臨界馬赫數效應般產生局部激波，效率驟降、噪音劇增——這正是第41回減速齒輪箱存在的核心原因。</p>

  <div class="term"><b>Constant-Speed Propeller 定速槳（變距槳）</b>可透過液壓機構調整槳葉角度（螺距），在不同飛行階段維持接近最佳效率的螺旋槳</div>

LESSONS[44].subtitle = "同樣的推力，為什麼有的引擎特別省油";
LESSONS[44].content = `
<h2>觀念拆解</h2>
<p>噴射引擎推力可以用一個簡潔的<b>推力方程式</b>描述：<b>推力（F）＝質量流率（ṁ）× 排氣速度變化量（Δv）</b>，也就是 F = ṁ × (Ve − V0)，其中 Ve 為排氣速度、V0 為飛機飛行速度。這個公式說明了增加質量流率（吸入更多空氣）或增加排氣速度都能提升推力，但兩種途徑對燃油效率的影響截然不同。</p>
<p>衡量引擎燃油效率的關鍵指標是<b>比燃油消耗率（Specific Fuel Consumption, SFC）</b>，噴射引擎常用<b>TSFC（推力比燃油消耗率）</b>表示——產生單位推力所需消耗的燃油量，數值越低代表引擎效率越好。根據第43回學過的推進效率原理，讓大量空氣獲得較小速度增量（增加 ṁ）通常比讓少量空氣獲得極大速度增量（增加 Δv）更省油，這正是高旁通比引擎 TSFC 通常優於低旁通比或渦輪噴射引擎的物理原因。</p>
<p>噴射引擎推力大致隨飛行速度增加而略微下降（因進氣衝壓效應 Ram Effect 改變有效速度差），隨高度上升（空氣密度降低）而下降，但下降幅度不像活塞引擎（第41回）那樣劇烈。然而，引擎設計並非「旁通比越高越好」——極高旁通比引擎風扇直徑增大會增加重量與阻力（呼應第3回），也對機翼下方離地間隙有實務限制，因此每個世代客機引擎設計都是在推力、重量、噪音、成本、維護複雜度等多重工程限制下尋求最佳平衡點。</p>
<div class="callout analogy">🔍 日常生活類比：推力方程式 F=ṁ×Δv 的概念，就像消防水管噴水：同樣的水管出力，可以選擇「少量水但噴很快」（噴射水柱射得遠但水量小），或「大量水但噴不用太快」（大水量緩慢流出），兩者都能產生反作用力（推力），但用水效率（對應燃油效率）截然不同——這正是渦輪噴射與渦輪扇引擎推力產生策略差異的直觀類比。</div>
<h2>專業術語卡</h2>
<div class="term-grid">
  <div class="term"><b>Thrust Equation 推力方程式</b>F = 質量流率 × 排氣速度變化量，描述噴射引擎推力產生的基本物理關係</div>
  <div class="term"><b>Specific Fuel Consumption (SFC) 比燃油消耗率</b>衡量引擎燃油效率的關鍵指標，產生單位推力所需消耗的燃油量，數值越低效率越好</div>
  <div class="term"><b>TSFC (Thrust Specific Fuel Consumption) 推力比燃油消耗率</b>SFC的一種常見表示方式，專指噴射引擎每單位推力的燃油消耗率</div>
  <div class="term"><b>Ram Effect 衝壓效應</b>飛機高速飛行時，進氣道內空氣因飛機自身速度被壓縮增壓的現象，影響引擎在不同速度下的有效性能</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：航空公司在評估引擎採購決策時，TSFC 是核心考量指標之一，因為長期營運下，即使每單位推力燃油消耗差異看似微小，乘以數萬飛行小時與龐大機隊規模，累積的燃油成本差異可能是數億美元等級。這也是為什麼新世代引擎（如 CFM LEAP、Pratt & Whitney GTF 齒輪傳動渦輪扇引擎）持續投入研發提升旁通比與整體效率，即使初期採購或維護成本較高，長期營運經濟效益仍可能顯著優於舊世代引擎。</div>
<div class="callout summary">📌 課堂總結：推力方程式F=質量流率×排氣速度變化量，說明了增加空氣流量或排氣速度都能提升推力，但對燃油效率影響不同。TSFC是衡量引擎燃油效率的核心指標，高旁通比引擎通常有更低TSFC，但引擎設計需要在推力、重量、噪音、成本間取得平衡，並非單純追求越高旁通比越好。</div>
<h2>推力方程式與效率權衡 示意圖</h2>
<div class="diagram-box">推力方程式：F = ṁ(質量流率) × Δv(排氣速度變化量)

策略A（渦輪噴射，第42回）：       策略B（高旁通比渦輪扇，第43回）：
少量空氣 ×  極大速度增量           大量空氣 ×  較小速度增量
   ṁ小        Δv很大                  ṁ大         Δv較小
  → 同樣推力，但TSFC較高            → 同樣推力，但TSFC較低(更省油)

引擎設計多重權衡：
推力輸出 ⟷ 重量(旁通比↑風扇↑重量↑) ⟷ 噪音 ⟷ 成本 ⟷ 離地間隙限制</div>
`;

LESSONS[46].subtitle = "三根軸、三個舵面：飛機如何在空中轉身";
LESSONS[46].content = `
<h2>觀念拆解</h2>
<p>飛機繞三個軸旋轉，每個軸對應一種運動與一個主飛控面：縱軸（機頭到機尾）的<b>滾轉（Roll）</b>由<b>副翼（Aileron）</b>控制；橫軸（左右翼尖）的<b>俯仰（Pitch）</b>由<b>升降舵（Elevator）</b>控制；垂直軸（垂直機身）的<b>偏航（Yaw）</b>由<b>方向舵（Rudder）</b>控制，三者合稱<b>主飛控面（Primary Flight Controls）</b>。</p>
<p>副翼的作動原理很巧妙：左右副翼以相反方向偏轉（一邊向上、一邊向下），向下偏轉的副翼增加該側機翼有效弧度與攻角，升力增加；向上偏轉的副翼則相反。兩側升力差產生滾轉力矩——這正是第4回翼型弧度概念的直接應用（副翼偏轉本質上是局部改變翼型形狀）。升降舵位於水平尾翼後緣，向上偏轉時產生機頭上仰的力矩；方向舵位於垂直尾翼後緣，偏轉時產生側向力使機頭左右偏轉（呼應第33回力矩概念）。</p>
<p>副翼操作有個有趣的副作用，稱為<b>副翼逆偏航（Adverse Yaw）</b>：副翼滾轉時，升力增加的一側（下偏副翼）同時因升力增加而誘導阻力也增加（呼應第3回），導致該側阻力較大，機頭因此偏向阻力較大的一側，與預期滾轉方向相反。飛行員需搭配方向舵協調操作（Coordinated Turn）修正此現象。</p>
<div class="callout analogy">🔍 日常生活類比：三軸運動就像船舶的搖晃方式——滾轉如同船隻左右搖擺，俯仰如同船首船尾上下起伏，偏航如同船隻左右轉向。副翼逆偏航現象則像划獨木舟時，若只用單側划槳用力划水產生轉向，槳划水產生的阻力也會同時讓船頭略微偏向划槳的一側，需要額外修正才能精確控制航向。</div>
<h2>專業術語卡</h2>
<div class="term-grid">
  <div class="term"><b>Aileron 副翼</b>位於主翼外側後緣，左右反向偏轉控制滾轉（Roll）的主飛控面</div>
  <div class="term"><b>Elevator 升降舵</b>位於水平尾翼後緣，控制俯仰（Pitch）的主飛控面</div>
  <div class="term"><b>Rudder 方向舵</b>位於垂直尾翼後緣，控制偏航（Yaw）的主飛控面</div>
  <div class="term"><b>Adverse Yaw 副翼逆偏航</b>副翼滾轉操作時，因兩側誘導阻力差異導致機頭偏向與預期滾轉方向相反的現象</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：飛行學員在基礎訓練中學習「協調轉彎（Coordinated Turn）」操作，必須同時運用副翼（產生坡度）與方向舵（修正逆偏航）才能達到平滑不側滑的轉彎，轉彎協調儀（Turn Coordinator）上的側滑指示球（Slip/Skid Ball）正是用來判讀飛行員是否正確協調操作副翼與方向舵的重要儀表；現代電傳飛控客機（Fly-by-Wire）則透過飛控電腦自動計算並施加適量方向舵修正，大幅減輕飛行員手動協調的操作負擔。</div>
<div class="callout summary">📌 課堂總結：飛機三軸運動（滾轉、俯仰、偏航）分別由副翼、升降舵、方向舵三個主飛控面控制，副翼滾轉原理呼應第4回翼型弧度概念，但會伴隨誘導阻力差異造成的逆偏航現象，需要方向舵協調修正。理解三軸運動與主飛控面的對應關係，是理解飛機操縱邏輯的基礎。</div>
<h2>三軸運動與副翼逆偏航 示意圖</h2>
<div class="diagram-box">三軸運動：
       俯仰(Pitch) ↕ ← 升降舵
            │
  滾轉(Roll)━━✈━━ ← 副翼(左右機翼)
    ↺  ↻    │
       偏航(Yaw) ↔ ← 方向舵(垂直尾翼)

副翼逆偏航：
左副翼下偏(升力↑,誘導阻力↑) ── 機頭被拖向阻力較大側(與預期滾轉方向相反)
右副翼上偏(升力↓,誘導阻力↓)
→ 需搭配方向舵修正，達成協調轉彎</div>
`;

LESSONS[47].subtitle = "起降時多出來的翼型：襟翼、縫翼、擾流板的分工";
LESSONS[47].content = `
<h2>觀念拆解</h2>
<p><b>襟翼（Flaps）</b>安裝於主翼後緣，放下時增加機翼的有效弧度與／或面積，使升力係數曲線整體上移（呼應第4回翼型弧度概念），讓飛機在較低速度下仍能產生足夠升力，同時也顯著增加阻力——這正是起降階段「低速大升力＋可控制的高阻力（有助於進場減速）」需求的解決方案。</p>
<p><b>縫翼（Slats）</b>位於機翼前緣，放下時在主翼與縫翼間形成一道縫隙，讓下表面高壓氣流導引至上表面，重新為邊界層注入能量（呼應第7回邊界層概念），延緩氣流分離，提高臨界攻角與最大升力係數，讓飛機在更大攻角下仍不易失速。襟翼與縫翼統稱<b>高升力裝置（High-Lift Devices）</b>。</p>
<p><b>擾流板（Spoilers）</b>安裝於主翼上表面，升起時破壞該處氣流，大幅降低升力並增加阻力，主要有兩種用途：<b>飛行擾流板（Flight Spoilers）</b>在空中對稱升起用於輔助減速下降，或協助副翼進行滾轉操縱（尤其大型客機副翼效果有限時）；<b>地面擾流板（Ground Spoilers）</b>降落觸地後全數升起，瞬間破壞升力使飛機重量確實壓在起落架上，大幅提升煞車與反推力系統的有效性，縮短降落滑跑距離（呼應第37回）。</p>
<div class="callout analogy">🔍 日常生活類比：襟翼放下增加升力阻力的效果，就像游泳時把手掌從平順切水的姿勢改為稍微彎曲弧度划水的姿勢，雖然阻力增加但能划出更多推進力（升力）；擾流板升起破壞氣流降低升力的原理，則像在滑水板上刻意豎起邊緣讓水流變得紊亂，瞬間失去滑行的浮力效果，讓身體迅速下沉貼近水面——這正是地面擾流板讓飛機「確實貼地」以利煞車的直觀類比。</div>
<h2>專業術語卡</h2>
<div class="term-grid">
  <div class="term"><b>Flaps 襟翼</b>主翼後緣可放下的次級飛控面，增加有效弧度/面積以提升低速升力，同時增加阻力</div>
  <div class="term"><b>Slats 縫翼</b>主翼前緣可放下的裝置，透過縫隙導引氣流延緩邊界層分離，提高臨界攻角與最大升力係數</div>
  <div class="term"><b>Spoilers 擾流板</b>主翼上表面可升起的次級飛控面，用於減速、輔助滾轉（飛行擾流板）或降落後破壞升力協助煞車（地面擾流板）</div>
  <div class="term"><b>High-Lift Devices 高升力裝置</b>襟翼與縫翼等統稱，用於在起降階段動態提升機翼升力表現的裝置總稱</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：客機在進場降落程序中，飛行員依速度階段逐步放出不同角度的襟翼（如1度、5度、15度、全襟翼等分段設定），配合速度遞減逐步增加升力係數以維持安全攻角餘裕；觸地瞬間，地面擾流板會自動升起（通常與空氣/地面感應系統聯動，確認飛機確實觸地才會啟動，避免空中誤動作），瞬間破壞機翼升力讓飛機重量確實壓上起落架，這是煞車系統（第37回）與反推力裝置（第43回）能有效發揮減速效果的關鍵前提。</div>
<div class="callout summary">📌 課堂總結：襟翼與縫翼統稱高升力裝置，分別透過增加弧度/面積與延緩邊界層分離的方式，讓飛機在起降低速階段仍能維持足夠升力與失速餘裕。擾流板則透過破壞氣流降低升力，分飛行擾流板（輔助減速/滾轉）與地面擾流板（降落後協助煞車）兩種用途，三者統稱次級飛控面，與主飛控面協同運作，是起降階段飛行安全的重要保障。</div>

<h2>觀念拆解</h2>
<p>以空巴電傳飛控為例，飛控律（Control Laws）分為三個層級：<b>正常律（Normal Law）</b>是所有感測器正常運作時的預設模式，提供完整飛控保護（如攻角保護、過載保護、高速保護）；<b>異常律（Alternate Law）</b>在部分感測器失效或系統降級時啟用，保留部分但範圍縮減的保護功能；<b>直接律（Direct Law）</b>是系統嚴重降級時的最終備援模式，操縱桿輸入直接對應飛控面偏轉角度，不再有電腦運算保護，類似回歸傳統機械飛控的操縱邏輯。</p>
<p>這種「逐級降級」（Graceful Degradation）設計哲學，確保系統即使部分失效，仍能提供飛行員一定程度可操縱的飛機，而非「全有或全無」的單一失效模式，呼應第14回多重備援、第49回飛控電腦冗餘等貫穿全課程的核心安全設計哲學。</p>
<p>2009年法航447事故調查發現，飛機在皮托管結冰導致空速異常後，飛控律從正常律降級為異常律（部分保護功能喪失，包括攻角保護），機組人員在此情況下持續拉杆卻未能被系統阻止進入失速，凸顯「飛行員需理解當前飛控律狀態、不能假設保護功能永遠存在」的重要性。這正是整個課程反覆出現的<b>「瑞士起司模型」（Swiss Cheese Model）</b>安全哲學的縮影——多層防護即使個別層有漏洞，也不易同時對齊導致事故穿透，但這不代表任何單一層可以被過度依賴。</p>
<div class="callout analogy">🔍 日常生活類比：分級飛控律的逐級降級設計，就像手機在訊號不良時自動從5G降至4G、再降至3G，而非直接完全斷訊——即使功能與速度降級，仍能維持基本可用性。瑞士起司模型則像多層濾網疊加過濾雜質，即使某層濾網有破洞，只要不是所有層的破洞都剛好對齊在同一位置，整體仍能有效過濾。</div>

  <div class="term"><b>Normal Law 正常律</b>電傳飛控系統在所有感測器正常運作時的預設模式，提供完整飛控保護功能</div>
  <div class="term"><b>Alternate Law 異常律</b>部分感測器失效或系統降級時啟用，保留部分但範圍縮減的保護功能</div>
  <div class="term"><b>Direct Law 直接律</b>系統嚴重降級時的最終備援模式，操縱桿輸入直接對應飛控面偏轉，無電腦運算保護</div>

<div class="callout summary">📌 課堂總結：電傳飛控系統採用分級飛控律（正常律、異常律、直接律）設計，確保系統部分失效時仍能逐級降級提供可操縱性，而非全有或全無。法航447事故凸顯了飛行員理解當前飛控律狀態的重要性，而貫穿全課程的多層防護設計哲學（瑞士起司模型），正是航空安全「預防勝於治療」精神的具體體現。</div>

<h2>觀念拆解</h2>
<p><b>ICAO空域分類系統（Airspace Classification）</b>依管制服務等級與飛航規則要求，將空域分為 A 至 G 共七類：A 類空域（通常高空）僅允許儀器飛航規則（IFR）且需持續受管制；C/D 類空域常見於機場周邊（如管制塔台範圍），需與塔台通聯；G 類空域為非管制空域，目視飛航規則（VFR）下通聯要求最寬鬆。不同國家實際空域劃設略有差異，但 ICAO 架構提供國際通用基準。</p>
<p><b>IFR（儀器飛航規則）</b>飛行完全依賴儀表導航與飛航管制指示（呼應單元三儀表、單元四氣象），適用於雲中、夜間、低能見度等無法目視導航的情況；<b>VFR（目視飛航規則）</b>則依賴飛行員目視觀察地標與其他航空器保持間隔，通常要求最低能見度與雲幕高度（呼應第27回 Ceiling 概念）標準。</p>
<p>管制空域（Controlled Airspace）內，飛航管制單位（ATC）主動提供間隔服務，確保航空器之間維持安全間隔；非管制空域（Uncontrolled Airspace）則主要依賴飛行員自行<b>目視避讓（See and Avoid）</b>原則維持安全。此外，限制區、禁航區、危險區等特殊空域劃設，通常因軍事活動或特定危險活動而設立，飛行員在飛行計畫階段必須查閱並避開或申請通過。</p>
<div class="callout analogy">🔍 日常生活類比：空域分類系統就像城市交通的道路分級——高速公路（類似A類空域）有嚴格管制與速限，只允許特定車輛且需持續監控；市區道路（類似C/D類空域機場周邊）需要交通號誌與規則約束；鄉間小路（類似G類非管制空域）則較少正式管制，駕駛人需要自行注意來車避讓，這種「依風險與交通密度分級管理」的邏輯，與空域分類系統的設計理念相通。</div>

<div class="term-grid">
  <div class="term"><b>Controlled Airspace 管制空域</b>飛航管制單位提供間隔服務、確保航空器安全間隔的空域類型</div>

  <div class="term"><b>VFR (Visual Flight Rules) 目視飛航規則</b>依賴飛行員目視觀察地標與避讓其他航空器的飛行規則，有最低能見度雲幕高度要求</div>
  <div class="term"><b>See and Avoid 目視避讓</b>非管制空域中，飛行員自行目視觀察並避讓其他航空器以維持安全間隔的原則</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：商用客機航班幾乎全程依IFR規則飛行，持續與航路各管制機關通聯並接受間隔指示，即使天氣狀況良好符合VFR標準，客機仍普遍選擇IFR飛行以確保航路上的間隔服務與導航精確度；通用航空小型飛機則常依實際天候與訓練需求，在VFR與IFR規則間切換飛行，飛行員必須清楚了解自身所在空域類別、通聯要求與相應飛航規則，這是每次飛行計畫階段的基本功課。</div>

LESSONS[53].subtitle = "一串看似天書的代碼，其實是機場的天氣體檢報告";
LESSONS[53].content = `
<h2>觀念拆解</h2>
<p><b>METAR（例行天氣報告）</b>是機場定時（通常每小時或每半小時）發布的當前實際天氣觀測報告，標準格式包含機場代碼、觀測時間、風向風速、能見度、天氣現象（如降雨、霧）、雲況（雲量與高度）、溫度露點、氣壓基準（QNH，呼應第18回）等欄位，依固定順序排列的簡潔代碼組合。</p>
<p><b>TAF（機場天氣預報）</b>則是針對特定機場未來一段時間（通常24-30小時）的天氣預報，格式與METAR相似，但包含預期天氣變化的時間段標示（如BECMG漸變、TEMPO臨時變化等變化群組）。</p>
<p>判讀範例：風向風速（如"27015G25KT"代表風向270度、風速15節、陣風25節）、能見度（如"3SM"代表3英里）、雲況（"SCT025"代表疏雲量在2500英尺，"BKN008"代表多雲量在800英尺，呼應第27回 Ceiling 概念）、天氣現象代碼（如"-RA"代表小雨，"TSRA"代表雷雨伴隨降雨，呼應第30回雷雨概念）。飛行員在飛行前簡報必須能快速判讀METAR/TAF報文，評估起飛、航路、目的地機場天氣是否符合飛航規則要求（呼應第53回），並據以決定是否需要準備備降機場、額外燃油儲備（呼應第39回）。</p>
<div class="callout analogy">🔍 日常生活類比：METAR就像一張「當下天氣快照」，精簡但資訊密度極高，類似股票市場的即時報價；TAF則像「天氣趨勢預測報告」，類似天氣預報App顯示的未來24小時逐時預報，兩者搭配使用，如同投資人同時參考即時報價與趨勢分析來做決策，飛行員也需要同時掌握「現在的天氣」與「預期的天氣變化」才能做出完整的飛行決策。</div>
<h2>專業術語卡</h2>
<div class="term-grid">
  <div class="term"><b>METAR 例行天氣報告</b>機場定時發布的當前實際天氣觀測報告，包含風、能見度、雲況、溫度、氣壓等標準化代碼資訊</div>
  <div class="term"><b>TAF (Terminal Aerodrome Forecast) 機場天氣預報</b>針對特定機場未來一段時間的天氣預報，包含預期天氣變化時間段標示</div>
  <div class="term"><b>BECMG/TEMPO 漸變/臨時變化群組</b>TAF報文中用於標示預期天氣狀況漸進改變或短暫臨時變化的代碼群組</div>
  <div class="term"><b>Ceiling 雲幕高度</b>METAR/TAF報文中雲況欄位所描述、影響飛航規則判定的關鍵雲底高度資訊</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：航空公司簽派員與飛行員在製作飛行計畫時，必須綜合判讀起飛機場、航路沿線、目的地機場、以及至少一個備降機場的METAR與TAF報文，確認整體天氣狀況是否支持安全起降與航路飛行。若判讀發現目的地機場預報天氣可能低於降落標準（如低能見度、低雲幕），則需要在燃油計畫中納入額外備降油量（呼應第39回），並可能需要規劃備用進場方式（如更高等級的ILS，呼應第23回）；快速準確判讀這些高度標準化的氣象代碼，是每位民航駕駛員的基本必修能力。</div>
<div class="callout summary">📌 課堂總結：METAR提供機場當下實際天氣觀測，TAF提供未來一段時間的天氣預報，兩者搭配標準化代碼格式呈現風、能見度、雲況、天氣現象等關鍵資訊。飛行員需具備快速判讀能力，評估起降與航路天氣是否符合飛航規則要求，並據以規劃備降與燃油儲備等應變措施，是飛行前準備的核心技能之一。</div>
<h2>METAR 報文結構判讀 示意圖</h2>

18/16       → 溫度18°C／露點16°C
A2985       → 氣壓基準(QNH) 29.85 inHg</div>
`;

<h2>觀念拆解</h2>
<p>健康的<b>安全文化（Safety Culture）</b>包含四大特徵：<b>通報文化</b>（員工願意主動通報異常或潛在風險而不擔心究責）、<b>公正文化（Just Culture）</b>（區分無心疏失與蓄意違規，對前者採取學習改進而非懲罰態度）、<b>彈性文化</b>（組織能因應狀況調整層級決策模式）、<b>學習文化</b>（組織能從事故與異常事件中系統性學習並改進）。</p>
<p>現代航空事故調查普遍採用<b>根本原因分析（Root Cause Analysis）</b>，不滿足於找出「表面直接原因」，而是深入探究導致事故發生的一連串背景因素（組織文化、程序設計、訓練、設備等），避免「究責式」調查阻礙未來改進。獨立的事故調查機構（如美國NTSB）通常與究責/處罰機關分離，確保調查能不受法律究責壓力影響。</p>
<p><b>自願通報系統（Voluntary Reporting System，如美國ASRS航空安全通報系統）</b>鼓勵飛行員與機組人員即使在自身可能涉及疏失的情況下，仍願意通報異常事件，通常搭配「有限度免責」機制，目的是換取更完整的安全資訊蒐集，及早發現系統性風險趨勢，而非等到重大事故發生才被動應對。回顧全課程反覆出現的事故案例（Comet空難、法航447、達美191號班機、特內里費空難等），航空業展現了一套獨特的「事故驅動改進」（Accident-driven Improvement）產業特性——幾乎每一項重大安全規範或技術突破，背後都有一段慘痛的事故歷史。</p>
<div class="callout analogy">🔍 日常生活類比：公正文化（Just Culture）的理念，就像學校教育中，若學生誠實承認自己不理解某個觀念而主動發問，應該被鼓勵而非被嘲笑處罰，這樣才能讓學生願意持續誠實表達困惑、及早獲得協助；若學生因為害怕被嘲笑而隱瞞不懂之處，問題只會持續累積惡化。自願通報系統的邏輯與此類似——透過降低通報的心理與行政成本，換取更早、更完整的風險資訊。</div>

<h2>觀念拆解</h2>
<p><b>卡門線（Kármán Line）</b>由國際航空聯合會定義在約100公里高度，傳統上被視為大氣層與太空的分界線。超過此高度，大氣密度極度稀薄，傳統機翼升力原理（第1回）已無法提供足夠支撐，飛行器必須依賴軌道動力學（彈道式運動）而非空氣動力學維持「飛行」。</p>
<p>太空載具在大氣層內飛行階段，仍需面對可壓縮流、<b>熱障（Thermal Barrier）</b>（高速再入大氣層時因空氣壓縮摩擦產生極高溫度，呼應第6回可壓縮流概念的極端延伸）等航空工程課題；但進入軌道後，運作邏輯改為依賴牛頓運動定律的純粹動量守恆——無空氣阻力環境下，一旦達到軌道速度即可持續繞行，不需持續推力維持，這與航空器需要持續產生升力/推力對抗重力阻力的運作邏輯截然不同。</p>
<p>近年商業太空旅遊採用<b>次軌道飛行（Suborbital Flight）</b>概念：以類似飛機起飛、火箭動力加速衝出大氣層邊緣、體驗短暫失重後再入大氣層滑翔降落的複合式飛行剖面，結合了航空器（滑翔降落階段運用第34回滑翔力學）與太空載具（火箭動力衝出大氣層）兩種技術。而馬赫5以上的<b>高超音速飛行器（Hypersonic Vehicle）</b>，同時面臨極端氣動加熱、可壓縮流激波管理（呼應第6回），是航空工程與太空工程技術高度交集的前沿領域。</p>
<div class="callout analogy">🔍 日常生活類比：大氣層內飛行與軌道飛行的物理邏輯差異，就像在水中游泳（需要持續划水對抗阻力與浮力平衡，類似航空器需要持續升力推力）對比在太空中漂浮（一旦給予初始推力，在無阻力環境下會持續等速直線運動，類似太空船進入軌道後不需持續動力維持運行）；次軌道飛行的複合特性，則像一次同時結合「雲霄飛車般的加速衝刺」與「高空跳傘般的自由落體滑翔」的混合體驗。</div>

LESSONS[58].content = `
<h2>觀念拆解</h2>
<p><b>電動飛機（Electric Aircraft）</b>以電池驅動電動馬達取代傳統燃油引擎，核心優勢是零直接排放、運轉噪音大幅降低、維護結構相對簡化；但核心挑戰在於電池的<b>能量密度（Energy Density）</b>遠低於航空燃油——目前技術水準下，電池能量密度大約僅為航空燃油的1/30至1/50，這直接限制了電動飛機的續航力與航程（呼應第39回續航力航程概念），目前商業化電動飛機多集中於短程通勤或飛行訓練用途。</p>
<p><b>油電混合動力（Hybrid-Electric）</b>是過渡方案：結合傳統燃油引擎與電動馬達，部分機型構想採用<b>分散式推進（Distributed Propulsion）</b>概念——多具小型電動風扇分布於機翼不同位置，而非集中於少數大型引擎，理論上可提升推進效率與降低噪音。</p>
<p>協和號退役後，近年多家新創公司重新投入研發次世代超音速客機，試圖透過現代材料科學、更先進的引擎設計、以及<b>低音爆（Low-Boom）</b>氣動外型設計（降低超音速飛行時音爆對地面的影響，呼應第6回可壓縮流/激波概念），解決協和號當年面臨的油耗過高、音爆噪音法規限制等商業化障礙。無論電動飛機、混合動力或新一代超音速客機，都面臨同一套貫穿本課程的核心工程權衡邏輯——效率、重量、成本、法規限制之間的動態平衡（呼應第45回推力效率權衡、第38回重量平衡概念）。</p>
<div class="callout analogy">🔍 日常生活類比：電動飛機面臨的能量密度限制，就像電動車與燃油車的續航力差異——即使電動車技術持續進步，在能量密度物理限制下，長途越野或重載運輸情境仍是燃油車的優勢領域，電動飛機目前也是類似邏輯，更適合短程、輕量化的應用場景。低音爆超音速客機的設計理念，則像工程師重新設計消音器讓跑車引擎聲浪降到法規允許範圍內，而不是完全放棄追求高速性能。</div>
<h2>專業術語卡</h2>
<div class="term-grid">
  <div class="term"><b>Energy Density 能量密度</b>單位重量能儲存的能量，是比較電池與燃油等不同能源儲存方式效率的關鍵指標</div>
  <div class="term"><b>Hybrid-Electric Propulsion 油電混合推進</b>結合傳統燃油引擎與電動馬達的過渡性動力系統設計</div>
  <div class="term"><b>Distributed Propulsion 分散式推進</b>採用多具小型電動風扇分布於機翼不同位置，而非集中於少數大型引擎的推進系統構想</div>
  <div class="term"><b>Low-Boom Design 低音爆設計</b>透過特殊氣動外型設計降低超音速飛行時音爆強度與地面影響的技術路徑</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：目前已有小型電動飛機取得適航認證投入飛行訓練市場，展現電動飛機在特定利基市場（短程、低成本訓練飛行）的商業可行性；而部分新創公司持續進行低音爆超音速客機的原型測試，若能成功克服油耗與噪音法規限制，未來長程越洋航班的飛行時間可能大幅縮短，重新開啟超音速商用航空的市場想像。</div>
<div class="callout summary">📌 課堂總結：電動飛機受限於電池能量密度，目前適用於短程通勤與訓練用途；油電混合動力是過渡技術路徑，分散式推進概念可能提升效率降低噪音。新一代超音速客機透過低音爆設計試圖重啟商用超音速飛行的可能性。無論哪種未來科技路徑，都面臨效率、重量、成本、法規限制之間動態平衡的共同工程課題。</div>
<h2>能量密度比較與低音爆設計 示意圖</h2>
<div class="diagram-box">能量密度比較(示意)：
航空燃油  ████████████████████████████████████ (基準)
電池      █ (約1/30~1/50)
→ 電動飛機續航力受限，適合短程應用

低音爆設計理念：
傳統超音速機身：╱＼＼＼    ← 激波集中，音爆強烈
低音爆機身設計：╱‾╲_╱‾╲   ← 激波分散重塑，降低地面音爆強度</div>
`;

LESSONS[59].subtitle = "60回、8個單元：把整套航空知識串成一趟完整航班";
LESSONS[59].content = `
<h2>觀念拆解：60回知識地圖總覽</h2>
<p>這趟長達60回的旅程，其實始終在講同一件事：<b>一架飛機如何在物理定律的邊界內，安全地把人從一個地方送到另一個地方</b>。讓我們用一趟完整航班，把八個單元重新串起來：</p>
<p><b>為什麼飛得起來（單元一，第1-8回）</b>：升力、失速、阻力、翼型、展弦比、馬赫數、邊界層——這是整趟旅程最底層的物理根基，說明了機翼如何對抗重力，也劃出了失速這條不可逾越的紅線。</p>
<p><b>什麼撐住了這一切（單元二，第9-16回）</b>：機身結構、主翼結構、起落架、液壓系統、燃油與重心、電力系統、加壓艙——這是骨架與器官，說明了飛機如何承受應力、如何被供電供油、如何維持人體能存活的環境。</p>
<p><b>飛行員如何「看見」（單元三，第17-24回）</b>：空速、高度、姿態、航向、VOR/DME、GPS、ILS——七種獨立資訊來源交叉驗證，構成飛行員感知世界的方式，核心精神是「永不盲信單一儀表」。</p>
<p><b>天空的心情（單元四，第25-32回）</b>：大氣結構、氣壓風場、雲、亂流、積冰、雷雨風切變、噴射氣流——外部環境的變數，教會我們敬畏天氣、學會判讀而非對抗。</p>
<p><b>把理論變成數字（單元五，第33-40回）</b>：四力平衡、爬升轉彎、螺旋、性能圖表、起降距離、重量平衡、續航航程——這是把前兩個單元的理論，轉化為每次飛行前具體可計算的安全邊界。</p>
<p><b>什麼提供動力（單元六，第41-46回）</b>：活塞引擎、渦輪噴射、渦輪扇、螺旋槳、推力效率——不同任務需求，造就不同的動力系統選擇。</p>
<p><b>如何被操縱（單元七，第47-52回）</b>：主/次飛控面、電傳飛控、自動駕駛、飛控保護律——從機械操縱到高度自動化，但貫穿始終的是「多層防護、永不盲信」的安全哲學。</p>
<p><b>系統之外的人與規則（單元八，第53-60回）</b>：空域規則、氣象判讀、CRM、安全文化、產業差異、太空交集、未來科技——最後這個單元提醒我們，再精密的工程系統，最終仍需要人類的紀律、溝通、與持續學習的文化來支撐。</p>
<div class="callout analogy">🔍 終極整合類比：如果把這60回內容想像成認識一個人的完整過程——單元一二是認識他的身體構造與物理極限，單元三是認識他如何感知世界，單元四是認識他所處的環境，單元五是把這一切轉化為可信賴的行動計畫，單元六是認識驅動他前進的動力，單元七是認識他如何被引導與保護，單元八則是認識支撐他一切決策的人性、文化與制度。飛機從來不只是機器，而是一套物理、工程、人因緊密交織的完整系統。</div>
<h2>貫穿全課程的三大核心主線</h2>
<div class="term-grid">
  <div class="term"><b>主線一：攻角是核心</b>第2、7、17、34、35、49回反覆回到「失速的本質是攻角超過臨界值」這個原點</div>
  <div class="term"><b>主線二：多重備援與交叉驗證</b>第14、17、21、24、49、51回貫穿「永不盲信單一系統或資訊來源」</div>
  <div class="term"><b>主線三：事故驅動改進</b>Comet、法航447、達美191、特內里費——每個歷史教訓都催生了具體的技術或制度改進</div>
</div>
<div class="callout aviation">🛩️ 飛行員知識連結：這正是為什麼真正優秀的飛行員與航空工程師，從不把知識切割成互不相關的科目——他們理解攻角物理如何連結到儀表判讀，儀表判讀如何連結到自動化系統的信任邊界，而這一切最終都仰賴機組人員之間誠實、開放的溝通文化。60回課程走到這裡，你已經具備了看懂這整套系統如何環環相扣的能力。</div>
<div class="callout summary">📌 期末總結：從升力的物理起源，到結構如何承重，到儀表如何感知，到天氣如何影響，到性能如何計算，到引擎如何驅動，到飛控如何操縱與保護，到人與制度如何支撐這一切——這60回內容不是60個孤立的知識點，而是一套完整的、環環相扣的航空工程與飛行安全思維體系。恭喜你完成了這趟從地面到天際、從物理定律到人因文化的完整學習旅程。</div>
<h2>八單元整合航班剖面 示意圖</h2>

LESSONS[59].quizzes = [

/* =====================================================================
   5. 狀態與渲染
   ===================================================================== */
let currentLessonId = 1;
let quizState = {}; // { qIndex: selectedOptIndex }

function renderSidebar(){
  const nav = document.getElementById("unit-list");
  nav.innerHTML = "";
  UNITS.forEach((unit, uIdx) => {
    const det = document.createElement("details");
    det.className = "unit";
    det.open = uIdx === 0;
    const sum = document.createElement("summary");
    sum.textContent = unit.name;
    det.appendChild(sum);

    const wrap = document.createElement("div");
    wrap.className = "unit-lessons";
    const [start] = unit.range;
    unit.titles.forEach((title, i) => {
      const id = start + i;
      const lesson = LESSONS[id - 1];
      const item = document.createElement("div");
      item.className = "lesson-item" + (id === currentLessonId ? " active" : "") + (lesson.content ? "" : " locked");
      item.innerHTML = `<span class="num">${String(id).padStart(2,'0')}</span><span>${title}</span>` + (lesson.content ? "" : `<span class="lock-icon">🔒</span>`);
      item.onclick = () => selectLesson(id);
      wrap.appendChild(item);
    });
    det.appendChild(wrap);
    nav.appendChild(det);
  });

  const generated = LESSONS.filter(l => l.content).length;
  document.getElementById("progress-label").textContent = `${generated} / 60`;
  document.getElementById("progress-fill").style.width = (generated/60*100) + "%";
}

function selectLesson(id){
  currentLessonId = id;
  quizState = {};
  renderSidebar();
  renderMain();
  window.scrollTo(0,0);
}

function renderMain(){
  const lesson = LESSONS[currentLessonId - 1];
  const main = document.getElementById("main-content");

  if(!lesson.content){
    main.innerHTML = `
      <div class="eyebrow">${lesson.unit} · 第 ${String(lesson.id).padStart(2,'0')} 回</div>
      <h2 class="lesson-title">${lesson.title}</h2>
      <div class="locked-panel">
        <div class="big-num">🔒</div>
        <div>本回內容尚未生成</div>
        <div class="hint">請回覆 Claude：「生成第 ${lesson.id} 回：${lesson.title}」，內容確認後我會幫你把這一回的教材與測驗直接補進這個 HTML 檔案裡。</div>
      </div>
    `;
    return;
  }

  main.innerHTML = `
    <div class="eyebrow">${lesson.unit} · 第 ${String(lesson.id).padStart(2,'0')} 回</div>
    <h2 class="lesson-title">${lesson.title}</h2>
    <p class="subtitle">${lesson.subtitle || ""}</p>
    <div class="lesson-body">${lesson.content}</div>
    <div class="quiz-section">
      <div class="quiz-header">
        <h2 style="border:none;margin:0;">隨堂互動測驗</h2>
        <span class="quiz-score" id="quiz-score">尚未作答</span>
      </div>
      <div id="quiz-list"></div>
      <button class="reset-btn" onclick="resetQuiz()">重新測驗</button>
    </div>
  `;
  renderQuiz(lesson);
}

function renderQuiz(lesson){
  const list = document.getElementById("quiz-list");
  list.innerHTML = "";
  lesson.quizzes.forEach((quiz, qIdx) => {
    const card = document.createElement("div");
    card.className = "quiz-card";
    const qEl = document.createElement("div");
    qEl.className = "quiz-q";
    qEl.textContent = quiz.q;
    card.appendChild(qEl);

    quiz.opts.forEach((opt, oIdx) => {
      const btn = document.createElement("button");
      btn.className = "quiz-opt";
      btn.textContent = opt;
      btn.onclick = () => answerQuiz(qIdx, oIdx, lesson);
      card.appendChild(btn);
    });

    const exp = document.createElement("div");
    exp.className = "quiz-exp";
    exp.id = `exp-${qIdx}`;
    exp.textContent = "💡 " + quiz.exp;
    card.appendChild(exp);

    list.appendChild(card);
  });
  updateScore(lesson);
}

function answerQuiz(qIdx, oIdx, lesson){
  if(quizState[qIdx] !== undefined) return; // already answered
  quizState[qIdx] = oIdx;
  const card = document.querySelectorAll(".quiz-card")[qIdx];
  const opts = card.querySelectorAll(".quiz-opt");
  opts.forEach((btn, i) => {
    btn.disabled = true;
    if(i === lesson.quizzes[qIdx].ans) btn.classList.add("correct");
    else if(i === oIdx) btn.classList.add("wrong");
  });
  document.getElementById(`exp-${qIdx}`).classList.add("show");
  updateScore(lesson);
}

function updateScore(lesson){
  const answered = Object.keys(quizState).length;
  const correct = Object.entries(quizState).filter(([q,o]) => lesson.quizzes[q].ans === Number(o)).length;
  const scoreEl = document.getElementById("quiz-score");
  if(answered === 0){ scoreEl.textContent = "尚未作答"; }
  else{ scoreEl.textContent = `已答 ${answered} / ${lesson.quizzes.length}　正確 ${correct} 題`; }
}

function resetQuiz(){
  quizState = {};
  renderMain();
}

/* =====================================================================
   6. 初始化
   ===================================================================== */
renderSidebar();
renderMain();
</script>
