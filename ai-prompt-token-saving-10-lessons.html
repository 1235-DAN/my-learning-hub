<script>
// ══════════════════════════════════════════
//  LESSON DATA — AI 下指令的技巧（省 Token）
// ══════════════════════════════════════════
const LESSONS = [
// ──────────────────────────────
// 第 1 回
// ──────────────────────────────
{
  id: 1,
  title: '為什麼「省 Token」是一種技術，而不是小氣',
  tagline: '從計價、容量、注意力三個角度，理解 token 為什麼會反咬你',
  tags: ['Token', 'Context Window', '成本'],
  content: `
<h2>一、問題的起點：AI 不是「按次」收費</h2>
<p>很多人第一次用 AI 的直覺是：「我問一句，它答一句，一次算一次。」如果真是這樣，那寫指令時當然愛寫多長就寫多長。但實際上，語言模型的計價與運算單位<strong>不是「次」，是「token」</strong>——你送進去的每一個字、每一個標點、每一行貼上的文件，都在計數器上跳動。</p>
<p>更關鍵的是：模型<strong>沒有記憶</strong>。它不會「記得」你上一句說什麼。每一次回覆，系統都是把「系統指令 + 全部對話歷史 + 你貼的資料 + 這次的問題」重新整包送進模型算一遍。所以在多輪對話裡，你早上貼的那份 3,000 字報告，到了下午第 20 輪，已經被重複收費 20 次了。</p>
<p>這就是為什麼「省 token」不是省錢摳門的心態，而是<strong>一項可以量化、可以練習的工程技巧</strong>。</p>

<h2>二、浪費 token 的三個代價</h2>
<p>代價一是<strong>金錢</strong>，這最直觀。代價二是<strong>容量</strong>：每個模型都有一個叫做「上下文視窗（Context Window）」的硬上限，塞滿了就得砍掉舊訊息，你的重要指令可能就是被砍掉的那一段。</p>
<p>代價三最容易被忽略，也最致命：<strong>準確率</strong>。塞越多字，不代表模型越懂你。研究上有個現象叫「中間迷失（Lost in the Middle）」——當上下文很長時，模型對<em>開頭與結尾</em>的資訊掌握度明顯高於<em>中段</em>。你把關鍵限制條件寫在一大段廢話的中間，它被忽略的機率反而更高。</p>

<div class="callout analogy">
  <span class="callout-icon"></span>
  <p>把 AI 想成<strong>國際快遞的計重寄件</strong>。你要寄一份合約去日本，快遞按公斤收費。你可以把合約單獨裝進一個信封（輕、快、對方一眼看到重點），也可以把合約連同三本雜誌、兩包餅乾、一疊舊報紙塞進大紙箱一起寄（重、貴、對方還得翻半天才找到合約）。更慘的是，如果紙箱有重量上限，塞到滿了，櫃檯就會請你抽掉一些東西——被抽掉的可能剛好是那份合約。<strong>Token 就是重量，上下文視窗就是紙箱上限，而「找不找得到合約」就是準確率。</strong></p>
</div>

<h2>三、算給你看：一筆真實感的帳</h2>
<p>假設某模型的計價是「輸入每百萬 token 3 美元、輸出每百萬 token 15 美元」（本課所有計算都會明確給定單價，實際價格請以你使用的服務為準）。看看一個常見的浪費情境：</p>

<div class="code-block"><code><span class="c">// 情境：客服自動回覆，每天呼叫 2,000 次</span>

<h2>一、問題的起點：你刪錯地方了</h2>
<p>知道要省 token 之後，多數人的第一個動作是「把句子改短一點」。但如果你不知道 token 怎麼算，很可能刪了半天只省下 3%，卻沒發現真正的肥肉在別的地方——例如那個為了美觀而縮排的 JSON、那串貼上來的 base64、或那段中英夾雜的表格。</p>
<p>所以第 2 回要先建立一個能力：<strong>看一段文字，心算它大概值多少 token。</strong>不用精確，能估到正負 20% 就足以做決策。</p>

<h2>二、Token 不是「字」，是「常見片段」</h2>
<p>模型不是逐字閱讀，而是先用一個叫 <strong>Tokenizer（分詞器）</strong>的程式，把文字切成詞彙表裡的片段。主流做法叫 <strong>BPE（Byte Pair Encoding，位元組對編碼）</strong>：它先統計海量文本中哪些字元組合最常一起出現，把最常見的組合合併成一個「詞條」收進詞彙表。</p>
<p>結果就是：<strong>越常見的字串，越可能一個 token 就裝得下；越罕見、越破碎的字串，就得拆成好幾個 token。</strong></p>

<div class="code-block"><code><span class="c">// 同樣一句話，切法差很多（｜代表 token 邊界）</span>

<span class="n">常見英文單字</span>
  understanding      →  under｜standing            <span class="g">2 tokens</span>
  the quick brown    →  the｜ quick｜ brown         <span class="g">3 tokens</span>

<span class="n">罕見字／專有名詞</span>
  Antidisestablish   →  Ant｜idis｜estab｜lish      <span class="v">4 tokens</span>
  usr_id_88347xQ     →  usr｜_｜id｜_|883｜47｜xQ    <span class="v">7 tokens</span>

<span class="n">中文</span>
  上下文視窗          →  上｜下｜文｜視｜窗   <span class="v">約 5 tokens</span>
  <span class="c">（常見詞可能被合併，但整體仍遠比英文吃 token）</span>

<span class="n">數字與符號</span>
  1234567            →  123｜456｜7          <span class="v">3 tokens</span>
  {"name": "Amy"}    →  {｜"｜name｜"｜:｜ "｜Amy｜"｜}  <span class="v">約 9 tokens</span></code></div>

<div class="tb-wrap">
<table>

<div class="callout analogy">

  <p>Tokenizer 很像<strong>中文輸入法的詞庫</strong>。你打「今天天氣」，輸入法一次就跳出整個詞，因為它很常見；但你打一個罕見人名「郄鴻毅」，就得一個字一個字慢慢選，敲鍵次數暴增。BPE 的邏輯完全相同：常用的組合已經預先「收進詞庫」，一次搞定；罕見的組合只能拆碎了拼。所以當你在 prompt 裡塞了一堆亂碼般的 ID、雜湊值、UUID，等於逼模型用「一個字一個字選字」的方式付費閱讀。</p>

<h2>三、限制（C）是四欄裡最值錢的一欄</h2>
<p>如果四欄只能留一欄，留「限制」。原因是模型的預設行為往往是<strong>發散的</strong>：它傾向解釋、傾向補充、傾向給你三個方案。每一個「傾向」都是輸出 token，而輸出是最貴的。</p>

  <li><strong>單一答案</strong>：「只給最佳方案，不要列出替代方案」。</li>

<h2>二、五個關掉水龍頭的方法</h2>
<ol>
  <li><strong>指定可驗證的長度</strong>：「≤120 字」「3 個要點，每點一行」「只回一個數字」。避免「簡短」「精簡」這種主觀詞。</li>
  <li><strong>指定輸出結構</strong>：CSV、JSON、表格。結構本身就是長度的天花板——你只要 3 個欄位，它就寫不出散文。</li>
  <li><strong>明列禁止項</strong>：「不要重述題目、不要開場白、不要結語、不要提醒我注意事項」。這四句約 25 個輸入 token，經常砍掉 150 個以上的輸出 token。</li>
  <li><strong>設定 max_tokens</strong>：API 層的硬上限，是最後一道保險。注意它是「截斷」而非「壓縮」——設太低會得到半句話，所以要搭配文字限制一起用。</li>
  <li><strong>使用停止序列（Stop Sequence）</strong>：讓模型輸出到某個標記就停，適合批次抽取這類結構明確的任務。</li>
</ol>

<div class="callout analogy">
  <span class="callout-icon"></span>
  <p>你在路上攔住一個熱心的路人問：「請問火車站怎麼走？」<strong>沒有約束</strong>的話，他會告訴你這條路的歷史、他表哥也住這附近、順便推薦一家牛肉麵，十分鐘後你才聽到「左轉直走」。但如果你問：「火車站在我的左邊還是右邊？請只回答左或右。」——你會在兩秒內拿到答案。<strong>模型跟這位熱心路人一模一樣：不是不肯講重點，是你沒告訴它「只要重點」。</strong></p>
</div>

<h2>三、危險的一刀：不要把「思考」也一起砍掉</h2>
<p>這是本回最重要的警告。有些任務（多步驟推理、數學、複雜條件判斷）<strong>需要模型把推理過程寫出來才算得對</strong>。如果你為了省 token 強迫它「只給答案、不要過程」，正確率可能明顯下滑，然後你得重跑——最後更貴。</p>

<div class="tb-wrap">
<table>
  <thead><tr><th>任務類型</th><th>建議策略</th><th>理由</th></tr></thead>
  <tbody>
    <tr><td>分類／抽取／格式轉換</td><td>強力壓縮，只要答案</td><td>幾乎不需要推理，過程是純浪費</td></tr>
    <tr><td>摘要／改寫</td><td>指定字數上限</td><td>長度是唯一的失控來源</td></tr>
    <tr><td>多步驟計算／邏輯推理</td><td>允許推理，但限制最終輸出格式</td><td>砍掉推理會傷正確率，砍掉贅述不會</td></tr>
    <tr><td>創意寫作</td><td>指定篇幅與結構</td><td>沒有天花板就會無限延伸</td></tr>
  </tbody>
</table>
</div>

<p>一個好用的折衷寫法：<strong>「先在內部推理，最後只輸出一行 JSON 結果」</strong>——保留思考的正確率，但不讓過程佔滿版面。若使用支援獨立推理欄位的模型，也可以把推理與最終答案分開計費與顯示。</p>

<div class="callout avia">

<div class="callout warning">

<h2>三、例子的三條選材原則</h2>
<ol>
  <li><strong>挑邊界，不挑典型。</strong>模型本來就會處理最普通的案例，你的例子應該用在它會猜錯的地方：空值、超長、格式異常、有例外規則的那一種。三個都是「正常案例」的例子，等於白付三次錢。</li>
  <li><strong>越短越好。</strong>例子只需要展示「規則」，不需要展示「真實資料量」。用 15 字的假資料示範格式，效果跟貼一整段真實紀錄一樣，但便宜十倍。</li>
  <li><strong>覆蓋多樣性，而非數量。</strong>五個彼此相似的例子，效果通常不如兩個互補的例子。這就是<strong>邊際效益遞減（Diminishing Returns）</strong>：每多一個同質例子帶來的準確率提升越來越小，但 token 成本是線性增加的。</li>
</ol>

<h2>二、四個把雪球剷掉的方法</h2>
<ol>
  <li><strong>該開新對話就開。</strong>最簡單也最有效。當話題已經轉向、前面的內容不再被引用時，繼續留在舊對話裡就是每輪都在付「考古費」。</li>
  <li><strong>摘要壓縮（Compaction）。</strong>對話長到一定程度時，讓模型把前 N 輪濃縮成 200 字的結論與待辦，然後用摘要取代原始歷史。這是「用一次輸出 token 的成本，換往後每一輪的輸入節省」。</li>
  <li><strong>不要在對話中間貼大檔案。</strong>貼進去的那一刻起，它就會跟著每一輪重送。若一定要，處理完就摘要它，或改用檔案／檢索的方式（第 9 回）。</li>

  往後每輪至少多背 8,000 token 的包袱
  15 輪 × 8,000 = 120,000 token
  成本 = 120,000/1e6 × $3 = <span class="v">$0.36</span>

  往後每輪只背 400 token：15 × 400 = 6,000 token = $0.018
  合計 = <span class="g">$0.048</span>

<h2>一、問題的起點：貼整份文件是雙重浪費</h2>
<p>「反正上下文視窗很大，我把整份 200 頁的手冊貼進去，它自己會找。」——這句話同時犯了兩個錯。</p>
<p><strong>第一是錢的問題</strong>：那份手冊可能是 15 萬 token，每問一個問題就付一次，問十次就是 150 萬 token。<strong>第二是準確率的問題</strong>，而這個更嚴重：回想第 1 回的「中間迷失」——在超長上下文中，埋在中段的關鍵條文反而容易被忽略。你花了十倍的錢，買到一個更容易答錯的結果。</p>
<p>正確的做法是模仿人類查資料的方式：<strong>先定位，再閱讀。</strong></p>

<h2>二、分塊與檢索的三步驟</h2>
<ol>
  <li><strong>分塊（Chunking）</strong>：把長文件切成語意完整的小段，例如每 300～800 token 一塊，並在邊界重疊一小段避免切斷語意。切割點最好對齊章節或段落，而不是硬切字數。</li>
  <li><strong>檢索（Retrieval）</strong>：使用者提問時，先用關鍵字或向量相似度找出最相關的 3～5 塊。這一步不需要模型，成本幾乎是零。</li>
  <li><strong>組裝（Augment）</strong>：只把這幾塊連同問題送給模型，並加上一句限制：「只根據以上內容作答，找不到就回『資料中未提及』。」</li>
</ol>

<div class="code-block"><code><span class="c">// 200 頁手冊 ≈ 150,000 token，每天問 200 次</span>
<span class="c">// 輸入單價 $3/M</span>

<span class="n">【全文貼上】</span>
  200 × 150,000 = 30,000,000 token
  成本 = 30,000,000/1e6 × $3 = <span class="v">$90 / 天</span>
  而且中間迷失風險高、延遲長。

<span class="n">【檢索 4 塊 × 500 token = 2,000 token】</span>
  200 × 2,000 = 400,000 token
  成本 = 400,000/1e6 × $3 = <span class="g">$1.20 / 天</span>

<span class="c">→ 省 98.7%，準確率通常還更高，因為雜訊被濾掉了。</span></code></div>

<h2>三、三種由簡到繁的做法，別一開始就上重裝備</h2>

<div class="tb-wrap">
<table>
  <thead><tr><th>做法</th><th>怎麼做</th><th>適合的規模</th></tr></thead>
  <tbody>
    <tr><td>關鍵字定位</td><td>先用搜尋／grep 找到相關段落，手動貼那幾段</td><td>單一文件、臨時查詢</td></tr>
    <tr><td>摘要重用</td><td>先請模型摘要一次，之後都用摘要（500 token）取代原文</td><td>需要反覆引用同一份文件</td></tr>
    <tr><td>向量檢索（RAG）</td><td>建立嵌入索引，依語意相似度自動取出相關塊</td><td>大量文件、長期系統</td></tr>
  </tbody>
</table>
</div>

<p>特別推薦中間那一項：<strong>摘要重用</strong>。它幾乎零技術門檻，卻能解決最常見的浪費——「同一份長文件在對話裡被重複計費幾十次」。付一次摘要的錢，往後每一輪都只帶 500 token。</p>

<div class="callout analogy">
  <span class="callout-icon"></span>
  <p>你想知道某個成語的意思，會怎麼做？<strong>翻到那一頁，讀那三行。</strong>沒有人會為了查一個詞而從字典第一頁開始唸到最後一頁——那既慢又貴，而且唸完之後你反而忘了原本要查什麼。<strong>把整份 PDF 貼給 AI，做的正是「從第一頁唸到最後一頁」這件事。</strong>而字典之所以能快速定位，靠的是「部首索引」與「筆畫排序」——那就是檢索系統在做的事。</p>
</div>

<h2>五、專業術語卡</h2>
<div class="term-grid">
  <div class="term-card">
    <div class="term-en">Chunking</div>
    <div class="term-zh">分塊</div>
    <div class="term-desc">將長文件切成語意完整的小段，以便個別索引與檢索的前處理步驟。</div>

  <div class="term-card">
    <div class="term-en">Retrieval-Augmented Generation (RAG)</div>
    <div class="term-zh">檢索增強生成</div>
    <div class="term-desc">先從外部資料檢索相關段落、再連同問題送進模型作答的架構。</div>
  </div>
  <div class="term-card">
    <div class="term-en">Embedding</div>
    <div class="term-zh">嵌入向量</div>
    <div class="term-desc">把文字轉成數值向量，使語意相近的內容在空間中距離較近，供相似度檢索使用。</div>

    <div class="term-desc">要求模型只根據所提供的資料作答、查無資料即明說，用以抑制編造。</div>

</div>

<div class="callout avia">

  <p>沒有任何飛行員會把整本 QRH（快速參考手冊）背下來，也不會在引擎失效時從第一頁開始翻。他做的是：<strong>辨識徵狀 → 定位到那一頁 → 執行那一份檢查表。</strong>這就是檢索：手冊本身很厚（資料庫），但每次只調用其中一小段（chunk），而且調用的依據是當下的徵狀（query）。QRH 的分頁與索引設計，本質上就是人工版的 chunking——每一份檢查表都是一個語意完整、可獨立執行的區塊，不會切到一半。工程上這叫<strong>按需載入（Lazy Loading）</strong>：資源不預先全部載入記憶體，而是等到真正需要時才取。你的上下文視窗就是那塊記憶體。</p>
</div>

<div class="callout warning">
  <span class="callout-icon"></span>
  <p>「上下文視窗很大，所以全部貼進去最保險」——這是把「能塞得下」誤當成「效果最好」。除了十倍以上的費用之外，超長上下文的實際準確率往往比精準檢索更差（中間迷失），延遲也明顯更長。另一個相反方向的錯誤是<strong>分塊切太碎</strong>：把一條完整規則從中間切斷，檢索到的那半塊會讓模型答出殘缺甚至相反的結論。切割點要對齊語意邊界，並在區塊間保留一小段重疊。</p>
</div>

<div class="callout tip">

</div>

  ✓ JSON → CSV，去縮排（第2回）        ✓ 固定前綴放最上方，可快取（第8回）
  ✓ 加上依據限定，抑制編造（第9回）</code></div>

<h2>四、你的個人模板庫</h2>
<p>最後一步是把這些變成不用每次重想的東西。建立一個文字檔，放三到五個你最常用的骨架，例如：</p>
<ul>
  <li><strong>分類／標註模板</strong>：固定的類別集合 + CSV 輸出 + 依據限定。</li>
  <li><strong>摘要模板</strong>：指定字數上限 + 禁止開場結語 + 三個固定小標。</li>
  <li><strong>改寫模板</strong>：語氣 + 讀者 + 長度 + 禁用詞清單。</li>
  <li><strong>抽取模板</strong>：目標欄位 + 查無填 null + 單行 JSON。</li>
</ul>
<p>模板庫的價值不只在省 token，更在於<strong>它讓你的結果可重現</strong>——同一個模板產出的結果格式一致，可以直接進試算表、進資料庫、進報表。</p>

<div class="callout analogy">
  <span class="callout-icon"></span>
  <p>這就像廚房裡的<strong>備料（mise en place）</strong>。厲害的廚師不會在客人點餐後才開始切洋蔥、調醬汁——那些固定不變的工序全部事先備好（模板與快取前綴），現場只處理當天的變數（客人的口味、食材新鮮度）。結果是出餐更快、味道更穩定、浪費更少。<strong>省 token 到最後，本質上是一種備料的紀律：把重複的部分標準化，把注意力留給真正變動的那一小塊。</strong></p>
</div>

<h2>六、專業術語卡</h2>
<div class="term-grid">
  <div class="term-card">
    <div class="term-en">Cost per Successful Output</div>
    <div class="term-zh">每次成功結果成本</div>
    <div class="term-desc">單次成本除以一次成功率，是評估 prompt 優化成效的唯一正確指標。</div>
  </div>
  <div class="term-card">
    <div class="term-en">Token Budget</div>
    <div class="term-zh">詞元預算</div>
    <div class="term-desc">事先為系統指令、資料、範例、輸出各自分配的 token 額度上限。</div>
  </div>
  <div class="term-card">
    <div class="term-en">Prompt Template</div>
    <div class="term-zh">指令模板</div>
    <div class="term-desc">將固定骨架抽出、僅保留少數變數欄位的可重複使用指令，兼顧省 token 與結果一致性。</div>
  </div>
  <div class="term-card">
    <div class="term-en">Over-optimization</div>
    <div class="term-zh">過度優化</div>
    <div class="term-desc">為壓縮 token 而刪去必要資訊，導致成功率下滑、重試成本超過節省的反效果。</div>
  </div>
</div>

<div class="callout avia">
  <span class="callout-icon"></span>
  <p>整套課程的精神，其實就是<strong>燃油政策（Fuel Policy）</strong>。航線帶油不是越多越好也不是越少越好：多帶的油本身有重量，會消耗更多油去載它（這叫 fuel to carry fuel，正是「囉嗦稅」）；但少帶到低於法定備份油與轉降油，就是拿安全在賭（這是「過度優化」）。所以每一趟飛行都會依航路、天氣、備降場算出一個<strong>剛好而有餘裕</strong>的數字，並且用標準化的表格與程序做，而不是憑感覺。你的 prompt 也一樣：<strong>不追求最短，追求「剛好足夠 + 必要餘裕」，而且用模板讓它每次都一致。</strong>這就是工程紀律，不是省錢技巧。</p>
</div>

<div class="callout warning">
  <span class="callout-icon"></span>
  <p>最後提醒兩個相反方向的陷阱。<strong>陷阱一：優化錯的東西。</strong>在一個每天只跑十次的個人任務上花三小時省下 200 token，是最典型的過度工程——先算清楚「這個 prompt 一天跑幾次」，高頻的才值得深度優化。<strong>陷阱二：只看單次成本。</strong>把 prompt 砍到成功率剩四成，帳面上每次便宜了，CPSO 卻更高，還賠上你重跑與檢查的時間——而人的時間通常比 token 貴得多。</p>
</div>

<div class="callout tip">
  <span class="callout-icon"></span>
  <p>省 token 的終點不是最短的 prompt，而是最低的「每次成功結果成本」：足夠的限制、固定的格式、精選的範例、乾淨的脈絡、可快取的前綴、只送相關的資料。把這九招固化成三到五個模板，讓省 token 從每次動腦的功夫，變成一次設定、長期受益的紀律。</p>
</div>
<button class="lesson-complete-btn" onclick="markLessonComplete(10)">✅ 已完成本回學習</button>
  `,

// ══════════════════════════════════════════
//  STATE & PROGRESS (localStorage)
//  這個網頁是下載後自行部署使用，所以進度一律存 localStorage
// ══════════════════════════════════════════
const TOTAL = 10;
const PROGRESS_KEY = 'prompt-token-lesson-progress-';
let currentLesson = 1;

function markLessonComplete(lessonId) {
  localStorage.setItem(PROGRESS_KEY + lessonId, 'done');
  updateLessonButtonUI(lessonId);
  refreshProgressUI();
}

function isLessonComplete(lessonId) {
  return localStorage.getItem(PROGRESS_KEY + lessonId) === 'done';
}

function updateLessonButtonUI(lessonId) {
  const btn = document.querySelector('[onclick="markLessonComplete(' + lessonId + ')"]');
  if (!btn) return;
  if (isLessonComplete(lessonId)) {
    btn.textContent = '已完成 ✓';
    btn.disabled = true;
    btn.classList.add('completed');
  } else {
    btn.textContent = '✅ 已完成本回學習';
    btn.disabled = false;
    btn.classList.remove('completed');
  }
}

function completedCount() {
  let n = 0;
  for (let i = 1; i <= TOTAL; i++) if (isLessonComplete(i)) n++;
  return n;
}

function refreshProgressUI() {
  const done = completedCount();
  const pct = Math.round(done / TOTAL * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';
  document.getElementById('navProgress').textContent = done + ' / ' + TOTAL;
  document.querySelectorAll('.nav-btn').forEach((btn, i) => {
    btn.classList.toggle('done', isLessonComplete(i + 1));
  });
  document.querySelectorAll('.sidebar-item').forEach((el) => {
    const id = parseInt(el.dataset.id, 10);
    const tick = el.querySelector('.tick');
    if (tick) tick.textContent = isLessonComplete(id) ? '✓' : '';
  });
}

function resetProgress() {
  if (!confirm('確定要清除全部 10 回的完成紀錄嗎？此動作無法復原。')) return;
  for (let i = 1; i <= TOTAL; i++) localStorage.removeItem(PROGRESS_KEY + i);
  LESSONS.forEach(l => updateLessonButtonUI(l.id));
  refreshProgressUI();
}

// ══════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════
function renderNavBar() {
  const scroll = document.getElementById('navScroll');
  scroll.innerHTML = '';
  LESSONS.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (l.id === currentLesson ? ' active' : '');
    btn.textContent = '第' + l.id + '回';
    btn.onclick = () => goToLesson(l.id);
    scroll.appendChild(btn);
  });
}

const GROUPS = [
  { label: '第一篇　先看懂帳單', range: [1, 3] },
  { label: '第二篇　把指令減肥', range: [4, 6] },
  { label: '第三篇　脈絡與快取', range: [7, 9] },
  { label: '第四篇　實戰整合', range: [10, 10] }
];

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';
  GROUPS.forEach(g => {
    const sec = document.createElement('div');
    sec.className = 'sidebar-section';
    const head = document.createElement('div');
    head.className = 'sidebar-head';
    head.textContent = g.label;
    sec.appendChild(head);

    LESSONS.filter(l => l.id >= g.range[0] && l.id <= g.range[1]).forEach(l => {
      const item = document.createElement('div');
      item.className = 'sidebar-item' + (l.id === currentLesson ? ' active' : '');
      item.dataset.id = l.id;
      item.innerHTML = '<span class="num">' + String(l.id).padStart(2, '0') + '</span>'
                     + '<span>' + l.title + '</span><span class="tick"></span>';
      item.onclick = () => goToLesson(l.id);
      sec.appendChild(item);
    });
    list.appendChild(sec);
  });
}

function renderLessons() {
  const container = document.getElementById('lessonsContainer');
  container.innerHTML = '';
  LESSONS.forEach(l => {
    const div = document.createElement('div');
    div.id = 'lesson-' + l.id;
    div.className = 'lesson' + (l.id === currentLesson ? ' active' : '');
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-num-badge">
          <span class="label">LESSON</span>
          <span class="n">${String(l.id).padStart(2, '0')}</span>
        </div>
        <div class="lesson-meta">
          <h1>${l.title}</h1>
          <div class="tagline">${l.tagline}</div>
          <div class="tags">${l.tags.map(t => '<span class="tag">' + t + '</span>').join('')}</div>
        </div>
      </div>
      ${l.content}
      ${renderQuizSection(l)}
      ${renderLessonNav(l.id)}
    `;
    container.appendChild(div);
  });
}

function renderQuizSection(l) {
  if (!l.quizzes || !l.quizzes.length) return '';
  return `
    <div class="quiz-section">
      <h2>✏ 隨堂測驗（第 ${l.id} 回）</h2>
      ${l.quizzes.map((q, qi) => `
        <div class="quiz-item" id="q-${l.id}-${qi}">
          <div class="quiz-q"><span class="qnum">${qi + 1}</span>${q.type ? '<span class="qtype">' + q.type + '</span>' : ''}${q.q}</div>
          <div class="quiz-options">
            ${q.opts.map((opt, oi) => `
              <div class="quiz-opt" onclick="selectOpt(${l.id},${qi},${oi},${q.ans})" id="opt-${l.id}-${qi}-${oi}">
                <span class="opt-key">${String.fromCharCode(65 + oi)}.</span>
                <span>${opt.replace(/^[A-D]\. /, '')}</span>
              </div>
            `).join('')}
          </div>
          <button class="show-ans-btn" onclick="showExplain(${l.id},${qi})">▸ 顯示解析</button>
          <div class="quiz-explain" id="explain-${l.id}-${qi}">
            <strong>✓ 解析：</strong> ${q.exp}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderLessonNav(id) {
  return `
    <div class="lesson-nav">
      <button class="lesson-nav-btn" onclick="goToLesson(${id - 1})" ${id === 1 ? 'disabled' : ''}>← 上一回</button>
      <span style="font-size:12px;color:var(--ink-muted)">第 ${id} 回 / 共 10 回</span>
      <button class="lesson-nav-btn primary" onclick="goToLesson(${id + 1})" ${id === TOTAL ? 'disabled' : ''}>下一回 →</button>
    </div>
  `;
}

// ══════════════════════════════════════════
//  INTERACTION
// ══════════════════════════════════════════
function goToLesson(id) {
  if (id < 1 || id > TOTAL) return;
  document.getElementById('lesson-' + currentLesson)?.classList.remove('active');
  document.querySelectorAll('.nav-btn')[currentLesson - 1]?.classList.remove('active');

  currentLesson = id;

  document.getElementById('lesson-' + id)?.classList.add('active');
  document.querySelectorAll('.nav-btn')[id - 1]?.classList.add('active');
  document.querySelectorAll('.nav-btn')[id - 1]?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

  document.querySelectorAll('.sidebar-item').forEach((el) => {
    el.classList.toggle('active', parseInt(el.dataset.id, 10) === id);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectOpt(lessonId, qi, oi, correct) {
  const item = document.getElementById('q-' + lessonId + '-' + qi);
  const opts = item.querySelectorAll('.quiz-opt');
  opts.forEach((el, i) => {
    el.classList.remove('correct', 'wrong');
    if (i === correct) el.classList.add('correct');
    else if (i === oi && oi !== correct) el.classList.add('wrong');
  });
  showExplain(lessonId, qi);
}

function showExplain(lessonId, qi) {
  document.getElementById('explain-' + lessonId + '-' + qi)?.classList.add('show');
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
renderLessons();
renderNavBar();
renderSidebar();
LESSONS.forEach(l => updateLessonButtonUI(l.id));
refreshProgressUI();
</script>
