<script>
// ══════════════════════════════════════════
//  LESSON DATA — 世界經濟的類型與發展歷史
// ══════════════════════════════════════════
const LESSONS = [
// ──────────────────────────────
// 第 1 回
// ──────────────────────────────
{
  id: 1,
  title: '為什麼世界上會有「經濟」這件事？',
  tagline: '從稀缺性出發，理解每個社會都逃不掉的三個問題',
  tags: ['稀缺性', '機會成本', '經濟體系'],
  content: `
<h2>一、問題的起點：東西永遠不夠</h2>
<p>在談「經濟有哪幾種類型」之前，我們得先問一個更根本的問題：<strong>為什麼人類需要「經濟制度」這種東西？</strong></p>
<p>答案只有四個字：<strong>資源有限</strong>。地球上的土地、石油、勞動力、時間，都是有上限的；但人類想要的東西——更好的房子、更快的網路、更多的閒暇——卻沒有上限。當「有限的資源」撞上「無限的慾望」，就產生了經濟學的核心概念：<strong>稀缺性（Scarcity）</strong>。</p>
<p>請注意：稀缺不等於貧窮。空氣不稀缺，因為隨手可得；但即使是全世界最富有的人，他一天也只有 24 小時，時間對他來說仍然稀缺。<strong>只要一樣東西「用了就沒了、給了你就不能給他」，它就是稀缺的，就需要一套制度來決定怎麼分配。</strong>這套制度，就是經濟體系。</p>

<div class="callout analogy">
  <span class="callout-icon"></span>
  <p>想像一個 30 人的班級，只有 1 台投影機。誰能用？怎麼決定？你可以：① 按照慣例（老師優先，這是<strong>傳統</strong>）；② 由班長統一排班（這是<strong>計畫</strong>）；③ 誰願意付最多班費誰用（這是<strong>市場</strong>）。這三種答案，正好就是人類歷史上出現過的三種經濟體系原型。整個世界經濟史，其實就是這三種答案不斷混合、拉扯、翻轉的故事。</p>
</div>

<h2>二、選擇的代價：機會成本</h2>
<p>既然資源有限，做任何選擇就必然要放棄別的東西。經濟學把「為了得到某樣東西，所必須放棄的<em>最高價值</em>的另一個選項」稱為<strong>機會成本（Opportunity Cost）</strong>。</p>
<p>這是經濟學最重要、也最常被誤解的觀念。機會成本不是你「花掉的錢」，而是你「沒走的那條路本來能帶給你的價值」。</p>

<div class="code-block"><code><span class="c">// 範例：小明考慮辭掉工作去創業</span>

<span class="n">顯性成本</span>（真的掏出去的錢）
  租金 + 設備 + 原料 ............ 40 萬 / 年

<span class="n">隱性成本</span>（沒掏錢，但放棄掉的價值）
  原本的年薪 .................... 60 萬 / 年
  自有資金 50 萬放銀行的利息 ...... 1 萬 / 年

<span class="v">經濟成本 = 40 + 60 + 1 = 101 萬 / 年</span>

<span class="c">→ 所以創業年營收若只有 80 萬，會計帳上「賺錢」，</span>
<span class="c">   但經濟學上其實虧了 21 萬，因為放棄的更多。</span></code></div>

<h2>三、每個社會都要回答的三個問題</h2>
<p>不論是石器時代的部落、蘇聯的計畫委員會，還是今天的台灣，只要資源稀缺，就必須回答同樣的三個問題。經濟體系的差別，只在於「誰來回答、怎麼回答」。</p>

<div class="tb-wrap">
<table>
  <thead><tr><th>基本問題</th><th>英文</th><th>白話說明</th></tr></thead>
  <tbody>

    <tr><td>為誰生產？</td><td>For whom to produce</td><td>生產出來的東西，要怎麼分配給誰？</td></tr>
  </tbody>
</table>
</div>

<h2>四、圖解：生產可能曲線</h2>
<p>經濟學家用一張圖來表達「稀缺 + 取捨」：<strong>生產可能曲線（PPF）</strong>。橫軸和縱軸各是一種產品，曲線上的每一點都代表「資源被完全用光」的組合。想多要一點 A，就必須沿著線往下滑，犧牲一些 B——這就是機會成本的視覺化。</p>

</div>

<h2>五、專業術語卡</h2>
<div class="term-grid">
  <div class="term-card">
    <div class="term-en">Scarcity</div>
    <div class="term-zh">稀缺性</div>
    <div class="term-desc">資源的數量少於人們想要的數量，因此必須做出取捨——這是所有經濟問題的根源。</div>
  </div>
  <div class="term-card">
    <div class="term-en">Opportunity Cost</div>
    <div class="term-zh">機會成本</div>
    <div class="term-desc">做出某個選擇時，所放棄的其他選項中「價值最高」的那一個。</div>
  </div>
  <div class="term-card">
    <div class="term-en">Production Possibility Frontier</div>
    <div class="term-zh">生產可能曲線</div>
    <div class="term-desc">在資源與技術固定下，一個經濟體所能生產的兩種產品的最大組合軌跡。</div>
  </div>
  <div class="term-card">
    <div class="term-en">Economic System</div>
    <div class="term-zh">經濟體系</div>
    <div class="term-desc">一個社會用來回答「生產什麼、如何生產、為誰生產」的整套制度安排。</div>

</div>

</div>

<p>這就是<strong>指令經濟／計畫經濟（Command Economy）</strong>的初衷。1928 年，蘇聯推出第一個<strong>五年計畫</strong>，由國家計畫委員會（<strong>Gosplan</strong>）制定全國每一項產品的產量目標、每一項物資的分配去向、每一種商品的價格。生產工具收歸國有，農業集體化，三大基本問題全部由中央回答。</p>

<h2>二、它確實做到了什麼</h2>
<p>公允地說，計畫經濟在特定條件下曾經非常有效。要把一個落後農業國，在短時間內硬推進重工業時代，中央動員的力量是驚人的：</p>

<p>經濟學家<strong>海耶克（F. A. Hayek）</strong>在 1945 年的論文中指出關鍵：社會運作所需的知識，是<strong>分散在千百萬人腦中的「當下與在地的知識」</strong>——哪個工廠的機器快壞了、哪個消費者今年偏好變了。這些知識無法被完整蒐集、彙整、送進中央，等你彙整完，情況早就變了。</p>

<h2>四、市場的前提條件（也是它的弱點）</h2>
<p>看不見的手不是魔法，它需要制度支撐才有效：<strong>私有財產權明確、契約可被執行、資訊不能太不對稱、要有足夠競爭者</strong>。任何一項缺失，市場就會失靈：獨占會抬價減產、汙染的成本沒被計入價格（外部性）、資訊不對稱會逼走好產品（檸檬市場）、國防與路燈這類公共財沒人願意付錢。</p>
<p>這些正是下一回「混合經濟」存在的理由——現實中沒有任何國家採用純粹的市場經濟。</p>

<h2>三、外部性：價格說謊的時候</h2>

  → 名目物價上漲 60%

<span class="c">// 人們會把足重的舊幣熔掉或藏起來，只花出成色差的新幣。</span></code></div>

<p>宋代商業高度發達，但四川通行沉重的鐵錢——買一匹絹要背幾十公斤的錢。商人於是把鐵錢寄存在鋪戶，換取一張「交子」憑證，憑票取錢。當大家發現直接轉讓憑證比取錢更方便時，紙幣就誕生了。</p>

<p>第一次工業革命的主角是蒸汽、煤與紡織；第二次（約 1870–1914）的主角則是<strong>電力、化學、鋼鐵與內燃機</strong>。兩者最大的差別在於：<strong>第一次是工匠的試誤，第二次是實驗室的科學。</strong></p>

<p>有趣的是，美國工廠導入電力後，生產力並沒有立刻跳升，而是延遲了約 20–30 年才顯現。原因是企業一開始只是把馬達裝在原本的傳動軸上，直到經理人重新設計整個廠房與流程，效益才爆發。<strong>這是經濟史上著名的「通用技術延遲」，今天的 AI 導入也在重演同一個劇本。</strong></p>

</div>

<h2>三、福特生產線：把時間切成秒</h2>
<p>泰勒（Frederick Taylor）的<strong>科學管理</strong>主張用碼錶測量每個動作，找出最有效率的標準作業方式。福特（Henry Ford）把這個概念與輸送帶結合，在 1913 年高地公園廠推出<strong>移動式裝配線</strong>。</p>

<div class="code-block"><code><span class="c">// 福特 Model T 底盤裝配工時的變化</span>

<span class="n">效率提升 ≈ 8 倍</span>

<span class="n">價格與銷量的連鎖反應</span>
  1909 年 Model T 售價 ....... 約 850 美元

  目的：降低離職率（原本年流動率超過 300%）
        並讓自家工人買得起自家的車
  <span class="c">// 這被稱為效率工資（Efficiency Wage）</span></code></div>

<h2>四、規模經濟與托拉斯</h2>
<p>鋼鐵、石油、鐵路這類產業有巨大的固定成本，產量越大、單位成本越低——這就是<strong>規模經濟（Economies of Scale）</strong>。結果是產業自然走向集中：卡內基鋼鐵、洛克斐勒的標準石油、摩根的金融帝國。</p>
<p>標準石油最盛時控制美國約 90% 的煉油產能。這帶來效率，也帶來<strong>獨占定價、打壓對手、操縱鐵路運費</strong>等問題。美國因此通過<strong>1890 年《休曼反托拉斯法》</strong>，並在 1911 年將標準石油拆分為 34 家公司（其中幾家後來成為艾克森、美孚、雪佛龍）。</p>
<p><strong>這是市場經濟史上關鍵的制度轉折：國家第一次正式承認「市場會自己殺死市場」，因而必須主動維持競爭。</strong>今天對科技平台的反壟斷訴訟，用的仍是同一套法律工具。</p>

<h2>二、亞當斯密（1723–1790）：分工與自發秩序</h2>
<p>《國富論》（1776）開篇不是講市場，而是講一間<strong>大頭針工廠</strong>：一個人獨力做針，一天做不到 20 支；把工序拆成 18 道由不同人負責，平均每人每天可做 4,800 支。</p>

<p>伏克爾真正建立的不只是低通膨，而是<strong>信譽（Credibility）</strong>：他證明了央行願意承受衰退也要守住物價。此後三十年，各國央行紛紛走向獨立化與通膨目標制——<strong>這是「制度優於裁量」原則的勝利，也是第 22 回法定貨幣時代所需要的那套軟約束真正成形的時刻。</strong></p>

<p>值得注意的是，這兩場改革的評價至今仍高度分歧，而且雙方講的其實是不同的指標：支持者看的是通膨受控、成長恢復、企業活力與國營事業效率提升；批評者看的是不平等急速擴大、工會力量瓦解、製造業城鎮長期衰敗、金融部門過度膨脹。<strong>兩邊的數據往往都成立——這正是分配問題的本質：總量改善不等於人人改善。</strong></p>

<h2>四、華盛頓共識與它的反挫</h2>
<p>1989 年，經濟學家威廉森歸納出當時國際機構對開發中國家的標準處方，稱為<strong>華盛頓共識（Washington Consensus）</strong>：財政紀律、稅制改革、利率與匯率市場化、貿易與外資自由化、私有化、鬆綁管制、保障產權。</p>
<p>這套處方在拉美與東歐被大力推行，結果好壞參半。俄羅斯 1990 年代的「震盪療法」造成產出崩跌與寡頭崛起；相對地，中國採取漸進雙軌（第 8 回）反而更成功。<strong>後來的檢討普遍認為：改革的順序與制度基礎，比清單上的項目本身更重要。</strong>先建立監理能力再開放金融，與先開放再說，結果會完全不同——這正是 1997 年亞洲金融風暴的伏筆（第 26 回）。</p>

// ══════════════════════════════════════════
//  STATE & PROGRESS (localStorage)
//  這個網頁是下載後自行部署使用，所以進度一律存 localStorage
// ══════════════════════════════════════════
const TOTAL = 30;
const PROGRESS_KEY = 'econ-lesson-progress-';
let currentLesson = 1;

function markLessonComplete(lessonId) {
  localStorage.setItem(PROGRESS_KEY + lessonId, 'done');
  updateLessonButtonUI(lessonId);
  refreshProgressUI();
}

function isLessonComplete(lessonId) {
  return localStorage.getItem(PROGRESS_KEY + lessonId) === 'done';
}

function updateLessonButtonUI(lessonId) {
  const btn = document.querySelector('[onclick="markLessonComplete(' + lessonId + ')"]');
  if (!btn) return;
  if (isLessonComplete(lessonId)) {
    btn.textContent = '已完成 ✓';
    btn.disabled = true;
    btn.classList.add('completed');
  } else {
    btn.textContent = '✅ 已完成本回學習';
    btn.disabled = false;
    btn.classList.remove('completed');
  }
}

function completedCount() {
  let n = 0;
  for (let i = 1; i <= TOTAL; i++) if (isLessonComplete(i)) n++;
  return n;
}

function refreshProgressUI() {
  const done = completedCount();
  const pct = Math.round(done / TOTAL * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';
  document.getElementById('navProgress').textContent = done + ' / ' + TOTAL;
  document.querySelectorAll('.nav-btn').forEach((btn, i) => {
    btn.classList.toggle('done', isLessonComplete(i + 1));
  });
  document.querySelectorAll('.sidebar-item').forEach((el) => {
    const id = parseInt(el.dataset.id, 10);
    const tick = el.querySelector('.tick');
    if (tick) tick.textContent = isLessonComplete(id) ? '✓' : '';
  });
}

function resetProgress() {
  if (!confirm('確定要清除全部 30 回的完成紀錄嗎？此動作無法復原。')) return;
  for (let i = 1; i <= TOTAL; i++) localStorage.removeItem(PROGRESS_KEY + i);
  LESSONS.forEach(l => updateLessonButtonUI(l.id));
  refreshProgressUI();
}

// ══════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════
function renderNavBar() {
  const scroll = document.getElementById('navScroll');
  scroll.innerHTML = '';
  LESSONS.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (l.id === currentLesson ? ' active' : '');
    btn.textContent = '第' + l.id + '回';
    btn.onclick = () => goToLesson(l.id);
    scroll.appendChild(btn);
  });
}

const GROUPS = [
  { label: '第一篇　經濟體系的類型', range: [1, 8] },
  { label: '第二篇　從農業到工業革命', range: [9, 16] },
  { label: '第三篇　20 世紀的危機與重建', range: [17, 24] },
  { label: '第四篇　全球化與金融危機', range: [25, 30] }
];

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';
  GROUPS.forEach(g => {
    const sec = document.createElement('div');
    sec.className = 'sidebar-section';
    const head = document.createElement('div');
    head.className = 'sidebar-head';
    head.textContent = g.label;
    sec.appendChild(head);

    LESSONS.filter(l => l.id >= g.range[0] && l.id <= g.range[1]).forEach(l => {
      const item = document.createElement('div');
      item.className = 'sidebar-item' + (l.id === currentLesson ? ' active' : '');
      item.dataset.id = l.id;
      item.innerHTML = '<span class="num">' + String(l.id).padStart(2, '0') + '</span>'
                     + '<span>' + l.title + '</span><span class="tick"></span>';
      item.onclick = () => goToLesson(l.id);
      sec.appendChild(item);
    });
    list.appendChild(sec);
  });
}

function renderLessons() {
  const container = document.getElementById('lessonsContainer');
  container.innerHTML = '';
  LESSONS.forEach(l => {
    const div = document.createElement('div');
    div.id = 'lesson-' + l.id;
    div.className = 'lesson' + (l.id === currentLesson ? ' active' : '');
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-num-badge">
          <span class="label">LESSON</span>
          <span class="n">${String(l.id).padStart(2, '0')}</span>
        </div>
        <div class="lesson-meta">
          <h1>${l.title}</h1>
          <div class="tagline">${l.tagline}</div>
          <div class="tags">${l.tags.map(t => '<span class="tag">' + t + '</span>').join('')}</div>
        </div>
      </div>
      ${l.content}
      ${renderQuizSection(l)}
      ${renderLessonNav(l.id)}
    `;
    container.appendChild(div);
  });
}

function renderQuizSection(l) {
  if (!l.quizzes || !l.quizzes.length) return '';
  return `
    <div class="quiz-section">
      <h2>✏ 隨堂測驗（第 ${l.id} 回）</h2>
      ${l.quizzes.map((q, qi) => `
        <div class="quiz-item" id="q-${l.id}-${qi}">
          <div class="quiz-q"><span class="qnum">${qi + 1}</span>${q.type ? '<span class="qtype">' + q.type + '</span>' : ''}${q.q}</div>
          <div class="quiz-options">
            ${q.opts.map((opt, oi) => `
              <div class="quiz-opt" onclick="selectOpt(${l.id},${qi},${oi},${q.ans})" id="opt-${l.id}-${qi}-${oi}">
                <span class="opt-key">${String.fromCharCode(65 + oi)}.</span>
                <span>${opt.replace(/^[A-D]\. /, '')}</span>
              </div>
            `).join('')}
          </div>
          <button class="show-ans-btn" onclick="showExplain(${l.id},${qi})">▸ 顯示解析</button>
          <div class="quiz-explain" id="explain-${l.id}-${qi}">
            <strong>✓ 解析：</strong> ${q.exp}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderLessonNav(id) {
  return `
    <div class="lesson-nav">
      <button class="lesson-nav-btn" onclick="goToLesson(${id - 1})" ${id === 1 ? 'disabled' : ''}>← 上一回</button>
      <span style="font-size:12px;color:var(--ink-muted)">第 ${id} 回 / 共 30 回</span>
      <button class="lesson-nav-btn primary" onclick="goToLesson(${id + 1})" ${id === TOTAL ? 'disabled' : ''}>下一回 →</button>
    </div>
  `;
}

// ══════════════════════════════════════════
//  INTERACTION
// ══════════════════════════════════════════
function goToLesson(id) {
  if (id < 1 || id > TOTAL) return;
  document.getElementById('lesson-' + currentLesson)?.classList.remove('active');
  document.querySelectorAll('.nav-btn')[currentLesson - 1]?.classList.remove('active');

  currentLesson = id;

  document.getElementById('lesson-' + id)?.classList.add('active');
  document.querySelectorAll('.nav-btn')[id - 1]?.classList.add('active');
  document.querySelectorAll('.nav-btn')[id - 1]?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

  document.querySelectorAll('.sidebar-item').forEach((el) => {
    el.classList.toggle('active', parseInt(el.dataset.id, 10) === id);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectOpt(lessonId, qi, oi, correct) {
  const item = document.getElementById('q-' + lessonId + '-' + qi);
  const opts = item.querySelectorAll('.quiz-opt');
  opts.forEach((el, i) => {
    el.classList.remove('correct', 'wrong');
    if (i === correct) el.classList.add('correct');
    else if (i === oi && oi !== correct) el.classList.add('wrong');
  });
  showExplain(lessonId, qi);
}

function showExplain(lessonId, qi) {
  document.getElementById('explain-' + lessonId + '-' + qi)?.classList.add('show');
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
renderLessons();
renderNavBar();
renderSidebar();
LESSONS.forEach(l => updateLessonButtonUI(l.id));
refreshProgressUI();
</script>
</body>
</html>
